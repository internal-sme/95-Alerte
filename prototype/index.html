<title>95 Alerte</title>
<!-- Fichier généré par tools/build_prototype.py : modifier prototype/src/ puis relancer le script. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ============ TOKENS — DESIGN_SYSTEM.md §2–§4 ============ */
:root{
  /* Base */
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --border:#E2E8F0;
  --text:#0F172A; --text-muted:#475569; --primary:#1E40AF; --on-primary:#FFFFFF; --focus-ring:#2563EB;
  /* Familles d'alertes */
  --alert-incident:#B91C1C; --alert-vigilance:#C2410C; --alert-positive:#15803D; --alert-info:#0369A1;
  --alert-incident-soft:color-mix(in srgb,#B91C1C 10%,transparent);
  --alert-vigilance-soft:color-mix(in srgb,#C2410C 10%,transparent);
  --alert-positive-soft:color-mix(in srgb,#15803D 10%,transparent);
  --alert-info-soft:color-mix(in srgb,#0369A1 10%,transparent);
  --primary-soft:color-mix(in srgb,#1E40AF 10%,transparent);
  --on-alert:#FFFFFF;
  /* États et feedback */
  --neutral:#64748B; --status-progress:#C2410C; --status-done:#15803D; --status-error:#B91C1C;
  --success:#15803D; --warning:#B45309; --error:#B91C1C; --info:#0369A1;
  /* Typographie */
  --font:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --fs-display:1.75rem; --lh-display:2.125rem;
  --fs-h1:1.375rem; --lh-h1:1.75rem;
  --fs-h2:1.125rem; --lh-h2:1.5rem;
  --fs-h3:1rem; --lh-h3:1.375rem;
  --fs-body:1rem; --lh-body:1.5rem;
  --fs-sm:.875rem; --lh-sm:1.25rem;
  --fs-caption:.75rem; --lh-caption:1rem;
  /* Espacements (échelle 4/8) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-6:24px; --s-8:32px; --s-12:48px;
  /* Rayons */
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-full:999px;
  /* Élévation */
  --shadow-1:0 1px 2px rgba(15,23,42,.08);
  --shadow-2:0 4px 12px rgba(15,23,42,.12);
  --shadow-3:0 -8px 28px rgba(15,23,42,.16);
  /* Cibles tactiles */
  --tap:48px;
  /* Carte */
  --map-land:#EEF2F6; --map-urban:#E3E8EF; --map-forest:#DCEBDF; --map-water:#BFDDF0; --map-water-text:#0369A1; --map-road:#FFFFFF; --map-road-case:#D5DCE5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --map-land:#0F1829; --map-urban:#152036; --map-forest:#12291F; --map-water:#1C3A55; --map-water-text:#7CC4EE; --map-road:#2A3753; --map-road-case:#0B1220;
  --bg:#0B1220; --surface:#111A2E; --surface-2:#1A2540; --border:#273452;
  --text:#F1F5F9; --text-muted:#A3B1C6; --primary:#7AA2FF; --on-primary:#0B1220; --focus-ring:#93B4FF;
  --alert-incident:#F87171; --alert-vigilance:#FB923C; --alert-positive:#4ADE80; --alert-info:#38BDF8;
  --alert-incident-soft:color-mix(in srgb,#F87171 18%,transparent);
  --alert-vigilance-soft:color-mix(in srgb,#FB923C 18%,transparent);
  --alert-positive-soft:color-mix(in srgb,#4ADE80 18%,transparent);
  --alert-info-soft:color-mix(in srgb,#38BDF8 18%,transparent);
  --primary-soft:color-mix(in srgb,#7AA2FF 18%,transparent);
  --on-alert:#0B1220;
  --neutral:#94A3B8; --status-progress:#FB923C; --status-done:#4ADE80; --status-error:#F87171;
  --success:#4ADE80; --warning:#FBBF24; --error:#F87171; --info:#38BDF8;
  --shadow-1:none; --shadow-2:0 4px 12px rgba(0,0,0,.4); --shadow-3:0 -8px 28px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --map-land:#0F1829; --map-urban:#152036; --map-forest:#12291F; --map-water:#1C3A55; --map-water-text:#7CC4EE; --map-road:#2A3753; --map-road-case:#0B1220;
  --bg:#0B1220; --surface:#111A2E; --surface-2:#1A2540; --border:#273452;
  --text:#F1F5F9; --text-muted:#A3B1C6; --primary:#7AA2FF; --on-primary:#0B1220; --focus-ring:#93B4FF;
  --alert-incident:#F87171; --alert-vigilance:#FB923C; --alert-positive:#4ADE80; --alert-info:#38BDF8;
  --alert-incident-soft:color-mix(in srgb,#F87171 18%,transparent);
  --alert-vigilance-soft:color-mix(in srgb,#FB923C 18%,transparent);
  --alert-positive-soft:color-mix(in srgb,#4ADE80 18%,transparent);
  --alert-info-soft:color-mix(in srgb,#38BDF8 18%,transparent);
  --primary-soft:color-mix(in srgb,#7AA2FF 18%,transparent);
  --on-alert:#0B1220;
  --neutral:#94A3B8; --status-progress:#FB923C; --status-done:#4ADE80; --status-error:#F87171;
  --success:#4ADE80; --warning:#FBBF24; --error:#F87171; --info:#38BDF8;
  --shadow-1:none; --shadow-2:0 4px 12px rgba(0,0,0,.4); --shadow-3:0 -8px 28px rgba(0,0,0,.5);
  color-scheme:dark}
/* Réglages d'accessibilité internes (PARAM-01) */
:root[data-contrast="high"]{--border:var(--text-muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important}

/* ============ COMPOSANTS (repris par prototype/index.html) ============ */
*{box-sizing:border-box}
.ph{width:1.25em;height:1.25em;fill:currentColor;flex:none;vertical-align:-.25em}
.ph-sm{width:1rem;height:1rem} .ph-lg{width:1.5rem;height:1.5rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:var(--tap);padding:0 var(--s-6);border-radius:var(--r-md);border:1.5px solid transparent;font:600 var(--fs-body)/1 var(--font);cursor:pointer;text-decoration:none;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.icon-btn:focus-visible,.radio-card:focus-within,.vote button:focus-visible,.tab:focus-visible,.switch input:focus-visible+span{outline:2px solid var(--focus-ring);outline-offset:2px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:transparent;color:var(--primary);border-color:var(--primary)}
.btn-ghost{background:transparent;color:var(--primary)}
.btn-ghost:hover{background:var(--primary-soft)}
.btn-destructive{background:var(--error);color:var(--on-alert)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{display:inline-grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:var(--r-full);border:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow-2);cursor:pointer;position:relative}
.icon-btn .badge-count{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--error);color:var(--on-alert);font:700 11px/18px var(--font);text-align:center}

.field{display:grid;gap:6px}
.field label{font:600 var(--fs-sm)/var(--lh-sm) var(--font);color:var(--text)}
.field .help{font:400 var(--fs-caption)/var(--lh-caption) var(--font);color:var(--text-muted);display:flex;justify-content:space-between;gap:8px}
.input{width:100%;min-height:var(--tap);padding:var(--s-3) var(--s-4);border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font:400 var(--fs-body)/var(--lh-body) var(--font)}
.input:focus{outline:none;border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--primary-soft)}
.input[aria-invalid="true"]{border-color:var(--error)}
.input:disabled{background:var(--surface-2);color:var(--text-muted)}
textarea.input{min-height:96px;resize:vertical}
.field .err{display:flex;gap:6px;align-items:center;color:var(--error);font:500 var(--fs-caption)/var(--lh-caption) var(--font)}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 var(--s-3);border-radius:var(--r-full);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:500 var(--fs-sm)/1 var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip .ph{width:1rem;height:1rem}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-full);background:var(--surface-2);gap:4px}
.seg button{min-height:40px;padding:0 var(--s-4);border:0;border-radius:var(--r-full);background:transparent;color:var(--text-muted);font:600 var(--fs-sm)/1 var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.seg.is-block{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%}
.seg.is-block button{justify-content:center;padding:0 var(--s-2)}

.radio-card{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s-3);align-items:center;padding:var(--s-4);border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface);cursor:pointer}
.radio-card input{position:absolute;opacity:0;pointer-events:none}
.radio-card .rc-icon{width:44px;height:44px;border-radius:var(--r-full);display:grid;place-items:center}
.radio-card b{display:block;font:600 var(--fs-h3)/var(--lh-h3) var(--font)}
.radio-card small{display:block;color:var(--text-muted);font:400 var(--fs-sm)/var(--lh-sm) var(--font)}
.radio-card .rc-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center}
.radio-card:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.radio-card:has(input:checked) .rc-dot{border-color:var(--primary)}
.radio-card:has(input:checked) .rc-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.preview-author{display:flex;gap:var(--s-2);align-items:center;padding:var(--s-3);border-radius:var(--r-sm);background:var(--surface-2);font:400 var(--fs-sm)/var(--lh-sm) var(--font);color:var(--text-muted)}
.preview-author b{color:var(--text)}

.switch{display:flex;align-items:center;justify-content:space-between;gap:var(--s-4);min-height:var(--tap);font:400 var(--fs-body)/var(--lh-body) var(--font)}
.switch input{position:absolute;opacity:0}
.switch span{width:48px;height:28px;border-radius:14px;background:var(--border);position:relative;flex:none;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-1);transition:transform .2s}
.switch input:checked+span{background:var(--primary)}
.switch input:checked+span::after{transform:translateX(20px)}

.list{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--border);overflow:hidden}
.list-item{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s-3);align-items:center;min-height:56px;padding:0 var(--s-4);border-bottom:1px solid var(--border);color:var(--text);font:400 var(--fs-body)/var(--lh-body) var(--font)}
.list-item:last-child{border-bottom:0}
.list-item .val{color:var(--text-muted);font-size:var(--fs-sm);display:flex;align-items:center;gap:4px}

.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-1);border:1px solid var(--border);padding:var(--s-4)}

.toast{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-radius:var(--r-md);background:var(--text);color:var(--bg);font:500 var(--fs-sm)/var(--lh-sm) var(--font);box-shadow:var(--shadow-2)}
.toast .ph{color:var(--alert-positive)}
.toast.is-error .ph{color:var(--alert-incident)}
.toast .toast-action{margin-left:auto;background:none;border:0;color:inherit;font:700 var(--fs-sm)/1 var(--font);text-decoration:underline;cursor:pointer;min-height:32px}
:root[data-theme="dark"] .toast .ph{filter:saturate(1.2)}

.banner{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-3) var(--s-4);border-radius:var(--r-sm);font:400 var(--fs-sm)/var(--lh-sm) var(--font)}
.banner b{display:block;font-weight:600}
.banner-offline{background:var(--surface-2);color:var(--text)}
.banner-emergency{background:var(--alert-incident-soft);color:var(--text)}
.banner-emergency .ph{color:var(--alert-incident)}
.banner-info{background:var(--alert-info-soft);color:var(--text)}
.banner-info .ph{color:var(--alert-info)}

.modal{background:var(--surface);border-radius:var(--r-lg);padding:var(--s-6);box-shadow:var(--shadow-3);display:grid;gap:var(--s-3);max-width:340px}
.modal h3{margin:0;font:700 var(--fs-h2)/var(--lh-h2) var(--font)}
.modal p{margin:0;color:var(--text-muted);font:400 var(--fs-body)/var(--lh-body) var(--font)}
.modal .actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2);margin-top:var(--s-2)}

.sheet{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-3);padding:var(--s-2) var(--s-4) var(--s-4);display:grid;gap:var(--s-3)}
.sheet .grab{justify-self:center;width:40px;height:5px;border-radius:3px;background:var(--border)}

.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--r-sm)}
@keyframes shimmer{to{background-position:-200% 0}}

.empty{display:grid;justify-items:center;text-align:center;gap:var(--s-2);padding:var(--s-8) var(--s-4)}
.empty .empty-ill{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-muted)}
.empty h4{margin:var(--s-2) 0 0;font:600 var(--fs-h3)/var(--lh-h3) var(--font)}
.empty p{margin:0 0 var(--s-2);color:var(--text-muted);font:400 var(--fs-sm)/var(--lh-sm) var(--font);max-width:30ch}

.stepper{display:grid;gap:var(--s-2)}
.stepper .lbl{display:flex;justify-content:space-between;font:500 var(--fs-caption)/var(--lh-caption) var(--font);color:var(--text-muted)}
.stepper .track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.stepper .track i{display:block;height:100%;background:var(--primary);border-radius:3px}

/* Tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px 10px}
.tab{display:grid;justify-items:center;gap:2px;min-height:var(--tap);border:0;background:none;color:var(--text-muted);font:500 11px/14px var(--font);cursor:pointer;padding-top:6px}
.tab .ph{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--primary)}
.tab-report .fab{width:56px;height:56px;margin-top:-32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:var(--shadow-2);border:4px solid var(--surface)}
.tab-report .fab .ph{width:26px;height:26px}
.tab-report{color:var(--text)}

/* ---- Spécifiques 95 Alerte ---- */
.fam-incident{--fam:var(--alert-incident);--fam-soft:var(--alert-incident-soft)}
.fam-vigilance{--fam:var(--alert-vigilance);--fam-soft:var(--alert-vigilance-soft)}
.fam-positive{--fam:var(--alert-positive);--fam-soft:var(--alert-positive-soft)}
.fam-info{--fam:var(--alert-info);--fam-soft:var(--alert-info-soft)}

.badge{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 9px;border-radius:var(--r-full);font:600 var(--fs-caption)/1 var(--font);white-space:nowrap}
.badge .ph{width:14px;height:14px}
.badge-type{background:var(--fam-soft);color:var(--fam)}
.badge-status{background:var(--surface-2);color:var(--text)}
.badge-status .ph{color:var(--st,var(--text-muted))}
.badge-status.st-active{--st:var(--fam,var(--alert-positive))}
.badge-status.st-soon{--st:var(--alert-vigilance);background:var(--alert-vigilance-soft)}
.badge-status.st-sent{--st:var(--primary);background:var(--primary-soft)}
.badge-status.st-progress{--st:var(--status-progress);background:var(--alert-vigilance-soft)}
.badge-status.st-done{--st:var(--status-done);background:var(--alert-positive-soft)}
.badge-status.st-expired,.badge-status.st-draft{--st:var(--neutral);color:var(--text-muted)}
.badge-status.st-rejected{--st:var(--status-error);background:var(--alert-incident-soft)}
.badge-status.st-moderated{--st:var(--text-muted);border:1px dashed var(--border);background:transparent}

.marker{position:relative;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--on-alert)}
.marker svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.marker svg.shape path,.marker svg.shape rect,.marker svg.shape circle{fill:var(--fam);stroke:var(--surface);stroke-width:2.5}
.marker .ph{position:relative;width:16px;height:16px}
.marker.is-selected{width:44px;height:44px}
.marker.is-selected .ph{width:20px;height:20px}
.marker.is-selected::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:var(--fam-soft)}
.marker.is-critical::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--fam);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.25);opacity:0}}
.marker-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;padding:1px 6px;border-radius:4px;background:var(--fam);color:var(--on-alert);font:700 10px/14px var(--font);white-space:nowrap}
.cluster{display:inline-grid;place-items:center;border-radius:50%;background:var(--primary);color:var(--on-primary);font:700 var(--fs-sm)/1 var(--font);border:2.5px solid var(--surface);box-shadow:var(--shadow-2);font-variant-numeric:tabular-nums}
.cluster.c-s{width:32px;height:32px}.cluster.c-m{width:40px;height:40px}.cluster.c-l{width:48px;height:48px}
.me{position:relative;width:18px;height:18px;border-radius:50%;background:var(--focus-ring);border:3px solid var(--surface);box-shadow:0 0 0 14px color-mix(in srgb,var(--focus-ring) 18%,transparent)}

.alert-card{display:grid;grid-template-columns:36px minmax(0,1fr);gap:var(--s-3);align-items:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-3) var(--s-4) var(--s-4) var(--s-3);box-shadow:var(--shadow-1);color:var(--text);text-decoration:none;text-align:left;font:inherit;width:100%}
.alert-card > .marker{margin-top:2px}
.alert-card .ac-main{display:grid;gap:4px;min-width:0}
.alert-card .ac-eyebrow{display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;font:500 var(--fs-caption)/var(--lh-caption) var(--font);color:var(--text-muted)}
.alert-card .ac-eyebrow b{color:var(--fam);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.alert-card h4{margin:0;font:600 var(--fs-h3)/var(--lh-h3) var(--font);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert-card .meta{display:flex;gap:4px;align-items:center;color:var(--text-muted);font:400 var(--fs-sm)/var(--lh-sm) var(--font);min-width:0}
.alert-card .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-card .ac-foot{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-2);padding-left:var(--s-1)}
.alert-card .stats{display:flex;gap:var(--s-3);color:var(--text-muted);font:500 var(--fs-caption)/1 var(--font);font-variant-numeric:tabular-nums}
.alert-card .stats span{display:inline-flex;gap:3px;align-items:center}
.alert-card .stats .ph{width:14px;height:14px}
.alert-card .ac-photo{grid-column:1 / -1;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--fam-soft),var(--surface-2));display:grid;place-items:center;color:var(--fam);overflow:hidden}
.alert-card .ac-photo .ph{width:40px;height:40px;opacity:.7}
.alert-card .svc{display:flex;gap:6px;align-items:center;font:500 var(--fs-caption)/var(--lh-caption) var(--font);color:var(--primary)}

.vote{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.vote button{display:flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:var(--tap);border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font:600 var(--fs-sm)/1 var(--font);cursor:pointer;font-variant-numeric:tabular-nums}
.vote button .n{color:var(--text-muted);font-weight:500}
.vote button.up[aria-pressed="true"]{background:var(--alert-positive-soft);border-color:var(--alert-positive);color:var(--text)}
.vote button.up[aria-pressed="true"] .ph{color:var(--alert-positive)}
.vote button.down[aria-pressed="true"]{background:var(--alert-vigilance-soft);border-color:var(--alert-vigilance);color:var(--text)}
.vote button.down[aria-pressed="true"] .ph{color:var(--alert-vigilance)}

.comment{display:grid;grid-template-columns:36px 1fr;gap:var(--s-3)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font:700 var(--fs-sm)/1 var(--font)}
.avatar.anon{background:var(--surface-2);color:var(--text-muted)}
.comment .who{display:flex;gap:6px;align-items:baseline;font:600 var(--fs-sm)/var(--lh-sm) var(--font)}
.comment .who time{font-weight:400;color:var(--text-muted);font-size:var(--fs-caption)}
.comment p{margin:2px 0 6px;font:400 var(--fs-body)/var(--lh-body) var(--font)}
.comment .acts{display:flex;gap:var(--s-4);color:var(--text-muted);font:600 var(--fs-caption)/1 var(--font)}
.comment .acts button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;min-height:32px;padding:0}
.comment.reply{margin-left:48px}

.location{display:grid;gap:var(--s-2)}
.location .mini-map{height:96px;border-radius:var(--r-sm);position:relative;overflow:hidden;background:
  linear-gradient(115deg,transparent 46%,var(--border) 46% 49%,transparent 49%),
  linear-gradient(25deg,transparent 58%,var(--border) 58% 61%,transparent 61%),var(--surface-2)}
.location .mini-map .zone{position:absolute;left:30%;top:18%;width:42%;height:64%;border-radius:40% 55% 45% 50%;background:var(--fam-soft);border:1.5px dashed var(--fam)}
.location .row{display:flex;align-items:center;gap:var(--s-2);font:500 var(--fs-sm)/var(--lh-sm) var(--font)}
.location .row .ph{color:var(--text-muted)}
.location .row button{margin-left:auto}

.service{display:flex;gap:var(--s-3);align-items:center;padding:var(--s-3) var(--s-4);border-radius:var(--r-md);background:var(--primary-soft)}
.service .ph{color:var(--primary);width:24px;height:24px}
.service b{display:block;font:600 var(--fs-sm)/var(--lh-sm) var(--font)}
.service small{color:var(--text-muted);font:400 var(--fs-caption)/var(--lh-caption) var(--font)}

.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:24px 1fr;gap:var(--s-3);position:relative;padding-bottom:var(--s-4)}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:11px;top:22px;bottom:-2px;width:2px;background:var(--border)}
.timeline li:last-child::before{display:none}
.timeline li.done::before{background:var(--status-done)}
.timeline .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:grid;place-items:center;z-index:1}
.timeline li.done .dot{background:var(--status-done);border-color:var(--status-done);color:var(--on-alert)}
.timeline li.current .dot{border-color:var(--status-progress);color:var(--status-progress)}
.timeline .dot .ph{width:14px;height:14px}
.timeline b{display:block;font:600 var(--fs-sm)/var(--lh-sm) var(--font)}
.timeline li:not(.done):not(.current) b{color:var(--text-muted);font-weight:500}
.timeline small{color:var(--text-muted);font:400 var(--fs-caption)/var(--lh-caption) var(--font)}

.expiry{display:grid;gap:6px}
.expiry .lbl{display:flex;align-items:center;gap:6px;font:500 var(--fs-sm)/var(--lh-sm) var(--font);font-variant-numeric:tabular-nums}
.expiry .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.expiry .bar i{display:block;height:100%;border-radius:3px;background:var(--primary)}
.expiry.soon .lbl{color:var(--alert-vigilance)} .expiry.soon .bar i{background:var(--alert-vigilance)}
.expiry.over .lbl{color:var(--text-muted)} .expiry.over .bar i{background:var(--neutral)}

.radio-card.fam-incident .rc-icon,.radio-card.fam-positive .rc-icon,.radio-card.fam-vigilance .rc-icon,.radio-card.fam-info .rc-icon{background:var(--fam-soft);color:var(--fam)}
.radio-card.is-large{grid-template-columns:auto 1fr auto;padding:var(--s-4);min-height:88px}
.radio-card.is-large .rc-icon{width:52px;height:52px}
.identity{display:grid;grid-template-columns:56px 1fr;gap:var(--s-3);align-items:center;padding:var(--s-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.identity .avatar{width:56px;height:56px;font-size:var(--fs-h2)}
.identity b{display:block;font:600 var(--fs-h2)/var(--lh-h2) var(--font)}
.identity small{display:block;color:var(--text-muted);font:400 var(--fs-sm)/var(--lh-sm) var(--font)}
.verified{display:inline-flex;align-items:center;gap:4px;margin-top:4px;color:var(--alert-positive);font:600 var(--fs-caption)/1 var(--font)}
.verified .ph{width:16px;height:16px}

/* Gabarits d'écran (prototype et canevas) */
.screen-title{padding:var(--s-4) var(--s-4) 0;display:grid;gap:2px}
.screen-title.row{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--s-3)}
.screen-title h1{margin:0;font:700 var(--fs-h1)/var(--lh-h1) var(--font)}
.screen-title p{margin:0;color:var(--text-muted);font:400 var(--fs-sm)/var(--lh-sm) var(--font)}
.screen-pad{padding:var(--s-4);display:grid;gap:var(--s-4);align-content:start}
.list-section{display:grid;gap:var(--s-3)}
.section-label{margin:var(--s-2) 0 0;font:600 var(--fs-caption)/var(--lh-caption) var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.list-block{display:grid;gap:var(--s-2);padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--border)}
.list-block:last-child{border-bottom:0}
.list-block.switch-row{padding-block:0}
.lb-label{font:600 var(--fs-sm)/var(--lh-sm) var(--font);color:var(--text)}
.question{margin:var(--s-2) 0 0;font:700 var(--fs-h1)/var(--lh-h1) var(--font)}
.screen-footer{flex:none;padding:var(--s-3) var(--s-4) var(--s-4);background:var(--bg);border-top:1px solid var(--border)}
.icon-btn.flat{box-shadow:none;background:transparent}
.summary{display:grid;gap:var(--s-3)}
.summary-head{display:flex;align-items:center;gap:var(--s-2);margin:-6px -8px -4px 0}
.summary-head .icon-btn{margin-left:auto}
.summary-title{margin:0;font:700 var(--fs-h2)/var(--lh-h2) var(--font)}
.summary-meta{margin:0;display:flex;gap:6px;align-items:center;color:var(--text-muted);font:400 var(--fs-sm)/var(--lh-sm) var(--font)}
.map-top{position:absolute;top:var(--s-3);left:var(--s-3);right:var(--s-3);display:flex;gap:var(--s-2);align-items:center;z-index:6}
.map-top .search{flex:1;display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap);padding:0 var(--s-4);border-radius:var(--r-full);background:var(--surface);box-shadow:var(--shadow-2);color:var(--text-muted);font:400 var(--fs-sm)/1 var(--font);border:0;text-align:left;cursor:pointer}
.map-pill{position:absolute;top:72px;left:0;right:0;display:flex;justify-content:center;z-index:6;pointer-events:none}
.map-pill .pill{pointer-events:auto}
.map-locate{position:absolute;right:var(--s-3);z-index:6}
.report-hint{position:absolute;left:50%;bottom:calc(var(--tabbar-h,76px) + 6px);transform:translateX(-50%);z-index:31;border:0;background:none;padding:0;cursor:pointer}
.report-hint .tooltip{white-space:nowrap}

/* Démarrage et connexion (phase 1) */
.brand-mark{display:inline-grid;place-items:center;flex:none;border-radius:28%;background:var(--primary);color:var(--on-primary);font-family:var(--font);font-weight:800;letter-spacing:-.03em;box-shadow:var(--shadow-2)}
.splash{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;background:var(--primary);color:var(--on-primary);padding:var(--s-8) var(--s-6)}
.splash .brand-mark{background:var(--on-primary);color:var(--primary)}
.splash-center{display:grid;justify-items:center;align-content:center;gap:var(--s-3);text-align:center}
.splash-center h1{margin:var(--s-2) 0 0;font:700 var(--fs-display)/var(--lh-display) var(--font);letter-spacing:-.02em}
.splash-center p{margin:0;font:500 var(--fs-body)/var(--lh-body) var(--font);opacity:.85}
.splash-foot{display:flex;flex-direction:column;align-items:center;gap:var(--s-3);font:500 var(--fs-caption)/1 var(--font);opacity:.8}
.auth-hero{position:relative;height:208px;flex:none;overflow:hidden;border-bottom:1px solid var(--border)}
.auth-hero .map95 svg.map-art{top:-170px;left:-10px}
.auth-hero .map-pin{pointer-events:none}
.auth-body{gap:var(--s-6)}
.screen.auth > .screen-pad{flex:1 0 auto}
.screen.auth .screen-footer{position:sticky;bottom:0;z-index:2}
.auth-intro{display:grid;gap:var(--s-2)}
.auth-title{margin:0;font:700 var(--fs-display)/var(--lh-display) var(--font);letter-spacing:-.02em;text-wrap:balance}
.auth-lead{margin:0;color:var(--text-muted);font:400 var(--fs-body)/var(--lh-body) var(--font)}
.auth-actions{display:grid;gap:var(--s-3)}
.auth-stepper{padding:var(--s-3) var(--s-4) 0}
.help-text{margin:0;display:flex;gap:var(--s-2);align-items:flex-start;color:var(--text-muted);font:400 var(--fs-sm)/var(--lh-sm) var(--font)}
.help-text .ph{margin-top:2px;color:var(--alert-positive)}
.or{display:flex;align-items:center;gap:var(--s-3);color:var(--text-muted);font:500 var(--fs-caption)/1 var(--font);text-transform:uppercase;letter-spacing:.06em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.link-btn{justify-self:center;min-height:var(--tap);padding:0 var(--s-2);border:0;background:none;color:var(--primary);font:600 var(--fs-body)/1 var(--font);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link-btn.left{justify-self:start;padding-left:0}
.link-btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:4px}
.legal{margin:0;text-align:center;color:var(--text-muted);font:400 var(--fs-caption)/var(--lh-caption) var(--font)}
.auth-center{flex:1;display:grid;justify-items:center;align-content:center;gap:var(--s-3);padding:var(--s-6);text-align:center}
.auth-center.compact{flex:none;padding:var(--s-4) var(--s-2) 0}
.auth-center h2{margin:var(--s-2) 0 0;font:700 var(--fs-h1)/var(--lh-h1) var(--font);text-wrap:balance}
.auth-center p{margin:0;max-width:32ch;color:var(--text-muted);font:400 var(--fs-body)/var(--lh-body) var(--font)}
.status-hero{width:80px;height:80px;border-radius:50%;display:grid;place-items:center}
.status-hero .ph{width:40px;height:40px}
.status-hero.tone-info{background:var(--primary-soft);color:var(--primary)}
.status-hero.tone-positive{background:var(--alert-positive-soft);color:var(--alert-positive)}
.status-hero.tone-vigilance{background:var(--alert-vigilance-soft);color:var(--alert-vigilance)}
.status-hero.tone-error{background:var(--alert-incident-soft);color:var(--alert-incident)}
.status-hero .spinner{width:32px;height:32px;border-width:3.5px;color:var(--primary)}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s-2)}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:text}
.otp span{height:56px;display:grid;place-items:center;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--surface);font:600 22px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--text)}
.otp span.is-active{border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--primary-soft)}
.otp.is-error span{border-color:var(--error)}
.err{display:flex;gap:6px;align-items:center;color:var(--error);font:500 var(--fs-caption)/var(--lh-caption) var(--font)}
.field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-3)}
.stack-footer{display:grid;gap:var(--s-2)}
.identity .identity-action{grid-column:1 / -1}
.identity .badge{margin-top:6px}

/* Carte (fond illustré, marqueurs positionnés, position de l'utilisateur) */
.map95{position:absolute;inset:0;overflow:hidden;background:var(--map-land)}
.map95 svg.map-art{position:absolute;left:0;top:0;width:390px;height:768px}
.map95 .land{fill:var(--map-land)}
.map95 .urban{fill:var(--map-urban)}
.map95 .forest{fill:var(--map-forest)}
.map95 .water{fill:none;stroke:var(--map-water);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.map95 .road-case{fill:none;stroke:var(--map-road-case);stroke-width:9;stroke-linecap:round}
.map95 .road{fill:none;stroke:var(--map-road);stroke-width:6;stroke-linecap:round}
.map95 .road.minor{stroke-width:3}
.map95 .road-case.minor{stroke-width:5}
.map95 .label{fill:var(--text-muted);font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase}
.map95 .label.water-label{fill:var(--map-water-text);font-style:italic;text-transform:none;letter-spacing:0;font-weight:500}
.map-pin{position:absolute;transform:translate(-50%,-50%);z-index:3}
.map-pin.is-cluster{z-index:4}
.map95 .me{position:absolute;transform:translate(-50%,-50%);z-index:2}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.cat-tile{display:grid;justify-items:center;gap:var(--s-2);padding:var(--s-4) var(--s-2);border-radius:var(--r-md);background:var(--surface-2);border:1.5px solid transparent;color:var(--text);font:600 var(--fs-sm)/var(--lh-sm) var(--font);cursor:pointer;text-align:center}
.cat-tile[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}

.upload{display:flex;gap:var(--s-2)}
.upload-tile{position:relative;width:88px;height:88px;border-radius:var(--r-sm);overflow:hidden;background:linear-gradient(135deg,var(--alert-positive-soft),var(--surface-2));display:grid;place-items:center;color:var(--text-muted)}
.upload-tile .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(15,23,42,.7);color:#fff;display:grid;place-items:center;cursor:pointer}
.upload-tile .prog{position:absolute;left:6px;right:6px;bottom:6px;height:4px;border-radius:2px;background:rgba(255,255,255,.5)}
.upload-tile .prog i{display:block;height:100%;width:62%;border-radius:2px;background:var(--primary)}
.upload-tile.err{background:var(--alert-incident-soft);color:var(--alert-incident);font:600 var(--fs-caption)/1.2 var(--font);text-align:center;padding:6px}
.upload-add{width:88px;height:88px;border-radius:var(--r-sm);border:1.5px dashed var(--border);background:transparent;color:var(--primary);display:grid;place-items:center;cursor:pointer}

.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 var(--s-4);border-radius:var(--r-full);background:var(--surface);color:var(--text);box-shadow:var(--shadow-2);font:600 var(--fs-sm)/1 var(--font);border:0;cursor:pointer}
.pill .dot-new{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.tooltip{position:relative;display:inline-block;padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);background:var(--text);color:var(--bg);font:500 var(--fs-sm)/var(--lh-sm) var(--font)}
.tooltip::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--text)}

/* ============ PROTOTYPE — styles propres à l'application ============
   Les tokens et composants viennent de docs/design-system/index.html (injectés au-dessus par
   tools/build_prototype.py). Ici : scène, cadre téléphone, structure des écrans, hôtes de
   sheets / modales / toasts, panneau de démo. */

:root{ --stage:#DCE3EC; --device:#0B0F19; --scrim:rgba(15,23,42,.45); --tabbar-h:76px; --statusbar-h:44px }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --stage:#05080F; --device:#000; --scrim:rgba(0,0,0,.6) }}
:root[data-theme="dark"]{ --stage:#05080F; --device:#000; --scrim:rgba(0,0,0,.6) }

html{font-size:var(--text-scale,100%);height:100%}
body{margin:0;height:100%;background:var(--stage);color:var(--text);font:400 var(--fs-body)/var(--lh-body) var(--font);-webkit-font-smoothing:antialiased}
#root{height:100%}
button{font-family:inherit}

/* ---- Scène et cadre ---- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding:24px 16px;box-sizing:border-box}
.device{position:relative;width:390px;height:844px;max-height:calc(100% - 8px);flex:none;border-radius:52px;border:11px solid var(--device);background:var(--bg);overflow:hidden;box-shadow:0 30px 80px rgba(15,23,42,.35)}
.device::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:var(--device);z-index:60;pointer-events:none}
@media (max-width:540px),(max-height:620px){
  .stage{padding:0;gap:0}
  .device{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}
  .device::before{display:none}
  .statusbar{display:none!important}
}

/* ---- Application ---- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}
.statusbar{height:var(--statusbar-h);flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0;font:600 15px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--text);position:relative;z-index:55}
.statusbar .sb-icons{display:flex;gap:5px;align-items:center}
.statusbar .ph{width:17px;height:17px}
.screen-area{position:relative;flex:1;min-height:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;background:var(--bg)}

.stack-layer{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:slide-in .22s ease-out}
.stack-layer.is-modal{animation:rise-in .25s ease-out}
.app-overlay{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column}
@keyframes slide-in{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes rise-in{from{transform:translateY(32px);opacity:.4}to{transform:none;opacity:1}}

.screen-header{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:var(--tap) 1fr var(--tap);align-items:center;min-height:56px;padding:0 var(--s-1);background:var(--bg);border-bottom:1px solid var(--border)}
.screen-header h1{margin:0;text-align:center;font:600 var(--fs-h2)/var(--lh-h2) var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-header .icon-btn{box-shadow:none;background:transparent}





.tabbar{flex:none;position:relative;z-index:30}

/* ---- Carte de remplacement (phase 3 la remplace) ---- */




/* ---- Bottom sheet (hôte) ---- */
.bs-scrim{position:absolute;inset:0;background:var(--scrim);z-index:24;animation:fade .2s}
.bs{position:absolute;left:0;right:0;bottom:0;z-index:25;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-3);transition:height .28s cubic-bezier(.2,.8,.2,1);touch-action:none}
.bs.is-dragging{transition:none}
.bs-handle{flex:none;display:grid;place-items:center;height:28px;border:0;background:transparent;cursor:grab;width:100%}
.bs-handle span{width:40px;height:5px;border-radius:3px;background:var(--border)}
.bs-handle:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-4px;border-radius:var(--r-lg)}
.bs-head{flex:none;display:flex;align-items:center;gap:var(--s-2);padding:0 var(--s-4) var(--s-2)}
.bs-head h2{margin:0;flex:1;font:600 var(--fs-h3)/var(--lh-h3) var(--font)}
.bs-body{flex:1;min-height:0;overflow-y:auto;padding:0 var(--s-4) calc(var(--s-4) + 28px);display:grid;gap:var(--s-3);align-content:start}
@keyframes fade{from{opacity:0}}

/* ---- Modale ---- */
.modal-scrim{position:absolute;inset:0;z-index:45;background:var(--scrim);display:grid;place-items:center;padding:var(--s-6);animation:fade .2s}
.modal-scrim .modal{width:100%;animation:rise-in .2s ease-out}

/* ---- Toasts ---- */
.toast-host{position:absolute;left:var(--s-3);right:var(--s-3);bottom:calc(var(--tabbar-h) + var(--s-3));z-index:50;display:grid;gap:var(--s-2);pointer-events:none}
/* Sans barre d'onglets, l'écran a souvent un pied d'actions : le toast passe sous l'en-tête pour ne pas le masquer. */
.toast-host.no-tabbar{bottom:auto;top:calc(56px + var(--s-2))}
.toast-host .toast{pointer-events:auto;animation:rise-in .2s ease-out}
.global-banner{position:relative;z-index:35;margin:0;border-radius:0}

/* ---- Écran de chargement / erreur ---- */
.boot{height:100%;display:grid;place-items:center;font:500 14px/1.4 system-ui,sans-serif;color:#475569}
.fatal{padding:var(--s-6);display:grid;gap:var(--s-3);align-content:center;height:100%;text-align:center}

/* ---- Panneau de démo ---- */
.demo-toggle{position:fixed;right:16px;bottom:16px;z-index:200;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font:600 13px/1 var(--font);box-shadow:var(--shadow-2);cursor:pointer;opacity:.85}
.demo-toggle:hover{opacity:1}
@media (max-width:540px){.demo-toggle{right:8px;bottom:calc(var(--tabbar-h) + 8px);min-height:32px;padding:0 10px;font-size:11px;opacity:.6}.demo-panel{right:8px;left:8px;width:auto;top:8px;bottom:auto;max-height:calc(100% - var(--tabbar-h) - 56px)}}
.demo-panel{position:fixed;right:16px;bottom:64px;z-index:201;width:min(340px,calc(100% - 32px));max-height:calc(100% - 96px);overflow-y:auto;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:var(--s-4);display:grid;gap:var(--s-3)}
.demo-panel h2{margin:0;font:700 var(--fs-h3)/var(--lh-h3) var(--font);display:flex;align-items:center;gap:8px}
.demo-panel .switch{min-height:40px;font-size:var(--fs-sm)}
.demo-panel .seg button{min-height:34px;padding:0 10px;font-size:var(--fs-caption)}
.demo-panel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font:500 var(--fs-sm)/1.3 var(--font)}
.demo-panel hr{border:0;border-top:1px solid var(--border);margin:0}
.demo-note{font:400 var(--fs-caption)/var(--lh-caption) var(--font);color:var(--text-muted)}

/* ---- Bibliothèque de composants ---- */
.lib-section{display:grid;gap:var(--s-3)}
.lib-row{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center}
.lib-markers{display:flex;flex-wrap:wrap;gap:22px;align-items:center;padding:8px 4px 16px}
.placeholder-phase{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font:600 var(--fs-caption)/1.2 var(--font)}

function seededJitter(id, amp) {
  let h = 0;
  for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const a = ((h % 1000) / 1000 - 0.5) * amp;
  const b = ((((h / 1000) | 0) % 1000) / 1000 - 0.5) * amp;
  return [a, b];
}

function buildAlert(row) {
  const [id, categoryId, title, description, communeId, quartier, street, ageMin, authorId, up, down, comments, hasPhoto, transmission, status, duplicateGroup] = row;
  const commune = COMMUNE_BY_ID[communeId];
  const [dLat, dLng] = seededJitter(id, 0.012);
  const fixed = ALERT_POSITIONS[id];
  const createdAt = BOOT_TIME - ageMin * MIN;
  return {
    id, categoryId, title, description, communeId, quartier, street,
    lat: fixed ? fixed[0] : commune.lat + dLat, lng: fixed ? fixed[1] : commune.lng + dLng,
    createdAt, expiresAt: createdAt + ALERT_TTL,
    authorId: authorId || `u${(id.length % 9) + 1}`, // l'auteur reste connu du système (CDC §9)
    anonymous: !authorId,
    votesUp: up, votesDown: down, commentsCount: comments,
    hasPhoto, transmission, status, duplicateGroup: duplicateGroup || null,
  };
}

const storage = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* stockage indisponible : l'app fonctionne sans */ }
  },
};

function fmtRelative(ms) {
  const m = Math.max(0, Math.round(ms / MIN));
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `il y a ${h} h`;
  const d = Math.floor(h / 24);
  return `il y a ${d} j`;
}

function fmtRemaining(ms) {
  if (ms <= 0) return "0 min";
  const totalMin = Math.ceil(ms / MIN);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return `${m} min`;
  return `${h} h ${String(m).padStart(2, "0")}`;
}

function fmtClock(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function haversineKm(a, b) {
  const R = 6371;
  const rad = (x) => (x * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function fmtDistance(km) {
  if (km < 1) return `${Math.max(50, Math.round((km * 1000) / 50) * 50)} m`;
  return `${km.toFixed(1).replace(".", ",")} km`;
}

function publicName(user) {
  if (user.display === "first") return user.firstName;
  return `${user.firstName} ${user.lastName[0]}.`;
}

/* Affichage public de l'auteur (CDC §9, §76, §89) : jamais d'email, téléphone ni adresse */
function publicAuthor(item) {
  if (item.anonymous) return { name: "Citoyen anonyme", anonymous: true, initials: null };
  const u = USERS[item.authorId];
  return { name: publicName(u), anonymous: false, initials: (u.firstName[0] + u.lastName[0]).toUpperCase() };
}

function displayPlace(alert) {
  const cat = CATEGORY_BY_ID[alert.categoryId];

  if (cat.precision === "rue" && alert.street) return `${alert.street}, ${commune}`;
  return `${alert.quartier}, ${commune}`;
}

/* Routage simulé : catégorie + localisation → service compétent (CDC §35) */
function routeAlert(alert) {
  const cat = CATEGORY_BY_ID[alert.categoryId];
  const svc = SERVICE_TYPES[cat.service];
  const commune = COMMUNE_BY_ID[alert.communeId];
  const name = svc.scope === "departement" ? `${svc.label} · Val-d'Oise` : `Service ${svc.label} · Ville de ${commune.name}`;
  return { id: cat.service, name, delayHours: svc.delay };
}

function alertLifecycle(alert, now) {
  if (alert.status !== "active") return alert.status;
  const left = alert.expiresAt - now;
  if (left <= 0) return "expiree";
  if (left <= HOUR) return "proche";
  return "active";
}

let toastSeq = 0;

function reducer(state, action) {
  switch (action.type) {
    case "SET_TAB":
      return { ...state, nav: { tab: action.tab, stack: [] }, sheet: null };
    case "PUSH":
      return { ...state, nav: { ...state.nav, stack: [...state.nav.stack, { id: action.screen, params: action.params || {}, key: `${action.screen}-${Date.now()}` }] }, sheet: null };
    case "POP":
      return { ...state, nav: { ...state.nav, stack: state.nav.stack.slice(0, -1) } };
    case "OPEN_SHEET":
      return { ...state, sheet: { id: action.sheet, params: action.params || {}, snap: action.snap || "half" } };
    case "SNAP_SHEET":
      return state.sheet ? { ...state, sheet: { ...state.sheet, snap: action.snap } } : state;
    case "CLOSE_SHEET":
      return { ...state, sheet: null };
    case "OPEN_MODAL":
      return { ...state, modal: action.modal };
    case "CLOSE_MODAL":
      return { ...state, modal: null };
    case "TOAST":
      return { ...state, toasts: [...state.toasts.slice(-2), { id: ++toastSeq, ...action.toast }] };
    case "DISMISS_TOAST":
      return { ...state, toasts: state.toasts.filter((t) => t.id !== action.id) };
    case "SET_PREF":
      return { ...state, prefs: { ...state.prefs, [action.key]: action.value } };
    case "SET_DEMO":
      return { ...state, demo: { ...state.demo, [action.key]: action.value } };
    case "VOTE": {
      // R8 : un vote par utilisateur et par alerte, modifiable
      const prev = state.votes[action.alertId] || 0;
      const next = prev === action.value ? 0 : action.value;
      const alerts = state.alerts.map((a) => {
        if (a.id !== action.alertId) return a;
        let { votesUp, votesDown } = a;
        if (prev === 1) votesUp--;
        if (prev === -1) votesDown--;
        if (next === 1) votesUp++;
        if (next === -1) votesDown++;
        return { ...a, votesUp, votesDown };
      });
      return { ...state, alerts, votes: { ...state.votes, [action.alertId]: next } };
    }
    case "SPLASH_DONE":
      return { ...state, session: { ...state.session, status: "auth" }, auth: { ...state.auth, step: "login" } };
    case "AUTH_GO":
      return { ...state, auth: { ...state.auth, step: action.step } };
    case "AUTH_SET":
      return { ...state, auth: { ...state.auth, ...action.patch } };
    case "LOGIN": {
      const user = action.user || USERS.me;
      const toasts = action.message ? [...state.toasts, { id: ++toastSeq, text: action.message, tone: "success" }] : state.toasts;
      return { ...state, session: { ...state.session, status: "in", user, identity: action.identity, method: action.method }, auth: initialAuth(), nav: { tab: "map", stack: [] }, sheet: null, toasts };
    }
    case "GUEST":
      return { ...state, session: { ...state.session, status: "in", user: null, identity: "non_verifiee", method: "invite" }, nav: { tab: "map", stack: [] } };
    case "LOGOUT":
      return { ...state, session: { ...state.session, status: "auth", user: null, identity: "non_verifiee", method: null }, auth: initialAuth(), nav: { tab: "map", stack: [] }, sheet: null, modal: null };
    case "RESTART":
      return { ...state, session: { ...state.session, status: "splash", user: null, method: null }, auth: initialAuth(), nav: { tab: "map", stack: [] }, sheet: null, modal: null };
    case "SET_IDENTITY": {
      const identity = action.identity === "result" ? ({ reussie: "verifiee", en_cours: "en_cours", manuelle: "en_cours" }[state.auth.idResult] || state.session.identity) : action.identity;
      return { ...state, session: { ...state.session, identity } };
    }
    case "RESET":
      return { ...initialState(), prefs: state.prefs, session: state.session };
    default:
      return state;
  }
}

const StoreContext = createContext(null);
const ClockContext = createContext(BOOT_TIME);
const useStore = () => useContext(StoreContext);
const useNow = () => useContext(ClockContext);

/* Actions de haut niveau partagées par les écrans */
function useActions() {
  const { dispatch } = useStore();
  return useMemo(() => ({
    setTab: (tab) => dispatch({ type: "SET_TAB", tab }),
    push: (screen, params) => dispatch({ type: "PUSH", screen, params }),
    pop: () => dispatch({ type: "POP" }),
    openSheet: (sheet, params, snap) => dispatch({ type: "OPEN_SHEET", sheet, params, snap }),
    snapSheet: (snap) => dispatch({ type: "SNAP_SHEET", snap }),
    closeSheet: () => dispatch({ type: "CLOSE_SHEET" }),
    confirm: (modal) => dispatch({ type: "OPEN_MODAL", modal }),
    closeModal: () => dispatch({ type: "CLOSE_MODAL" }),
    toast: (text, opts = {}) => dispatch({ type: "TOAST", toast: { text, tone: "success", ...opts } }),
    setPref: (key, value) => dispatch({ type: "SET_PREF", key, value }),
    setDemo: (key, value) => dispatch({ type: "SET_DEMO", key, value }),
    vote: (alertId, value) => dispatch({ type: "VOTE", alertId, value }),
    reset: () => dispatch({ type: "RESET" }),
  }), [dispatch]);
}

/* Sélecteurs */
function useVisibleAlerts() {
  const { state } = useStore();
  const now = useNow();
  return useMemo(() => {
    if (state.demo.emptyZone) return [];
    const base = state.demo.manyAlerts ? [...state.alerts, ...generateManyAlerts()] : state.alerts;
    return base.filter((a) => a.status === "active" && a.expiresAt > now);
  }, [state.alerts, state.demo.emptyZone, state.demo.manyAlerts, now]);
}

const SNAP_HEIGHTS = { peek: 132, half: 0.5, full: 0.92 };

function BottomSheet({ snap = "half", onSnap, onClose, title, modal, children, dismissible = true, peek = SNAP_HEIGHTS.peek, headerAction }) {
  const ref = useRef(null);
  const drag = useRef(null);
  const [dragH, setDragH] = useState(null);
  const parentH = () => ref.current?.parentElement?.clientHeight || 700;
  const heightFor = (s) => (s === "peek" ? peek : SNAP_HEIGHTS[s] * parentH());
  const order = ["peek", "half", "full"];

  useEffect(() => {
    if (!modal) return undefined;
    const onKey = (e) => { if (e.key === "Escape" && dismissible) onClose?.(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [modal, dismissible, onClose]);

  const onPointerDown = (e) => {
    drag.current = { y: e.clientY, h: heightFor(snap), moved: false };
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!drag.current) return;
    const dy = drag.current.y - e.clientY;
    if (Math.abs(dy) > 4) drag.current.moved = true;
    setDragH(Math.max(60, Math.min(parentH() * 0.95, drag.current.h + dy)));
  };
  const onPointerUp = () => {
    if (!drag.current) return;
    const { moved } = drag.current;
    const h = dragH;
    drag.current = null;
    setDragH(null);
    if (!moved || h == null) { cycle(); return; }
    if (h < heightFor("peek") * 0.6 && dismissible) { onClose?.(); return; }
    const nearest = order.reduce((best, s) => (Math.abs(heightFor(s) - h) < Math.abs(heightFor(best) - h) ? s : best), "peek");
    onSnap?.(nearest);
  };
  const cycle = () => onSnap?.(order[(order.indexOf(snap) + 1) % order.length]);
  const onHandleKey = (e) => {
    if (e.key === "ArrowUp") { e.preventDefault(); onSnap?.(order[Math.min(2, order.indexOf(snap) + 1)]); }
    if (e.key === "ArrowDown") { e.preventDefault(); const i = order.indexOf(snap); if (i === 0 && dismissible) onClose?.(); else onSnap?.(order[Math.max(0, i - 1)]); }
  };

  const height = dragH != null ? dragH : heightFor(snap);
  return (
    <Fragment>
      {modal && snap !== "peek" ? <div className="bs-scrim" onClick={dismissible ? onClose : undefined} aria-hidden="true" /> : null}
      <section ref={ref} className={cx("bs", dragH != null && "is-dragging")} style={{ height }} role={modal ? "dialog" : "region"} aria-label={title || "Panneau"} aria-modal={modal || undefined}>
        <button type="button" className="bs-handle" aria-label={`Panneau ${snap === "full" ? "agrandi" : snap === "half" ? "à moitié" : "réduit"} : glisser ou utiliser les flèches pour redimensionner`}
          onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp} onKeyDown={onHandleKey}>
          <span />
        </button>
        {title || headerAction || (modal && dismissible) ? (
          <div className="bs-head">
            {title ? <h2>{title}</h2> : <span style={{ flex: 1 }} />}
            {headerAction}
            {modal && dismissible ? <IconButton icon="x" label="Fermer" onClick={onClose} style={{ boxShadow: "none", width: 40, height: 40 }} /> : null}
          </div>
        ) : null}
        <div className="bs-body">{children}</div>
      </section>
    </Fragment>
  );
}

/* ---- Carte d'accueil : fond illustré du secteur Pontoise / Cergy (phase 3 : carte interactive complète) ---- */
const MAP_VIEW = { lat: 49.0508, lng: 2.1008, x: 195, y: 270, kx: 3200, ky: 4864 };
const NEAR_KM = 5;

function projectToMap(p) {
  return { x: MAP_VIEW.x + (p.lng - MAP_VIEW.lng) * MAP_VIEW.kx, y: MAP_VIEW.y - (p.lat - MAP_VIEW.lat) * MAP_VIEW.ky };
}

/* Doublons (CDC §81) : un seul marqueur par événement, celui qui a le plus de confirmations */
function dedupeEvents(alerts) {
  const best = {};
  alerts.forEach((a) => {
    if (!a.duplicateGroup) return;
    const cur = best[a.duplicateGroup];
    if (!cur || a.votesUp > cur.votesUp) best[a.duplicateGroup] = a;
  });
  return alerts.filter((a) => !a.duplicateGroup || best[a.duplicateGroup] === a);
}

/* Regroupement simple : marqueurs à moins de 30 px l'un de l'autre → un cluster */
function clusterPins(alerts) {
  const pts = alerts.map((a) => ({ a, ...projectToMap(a) })).filter((p) => p.x > 20 && p.x < 370 && p.y > 96 && p.y < 590);
  const used = new Set();
  const pins = [];
  pts.forEach((p) => {
    if (used.has(p.a.id)) return;
    const group = pts.filter((q) => !used.has(q.a.id) && Math.hypot(q.x - p.x, q.y - p.y) < 30);
    group.forEach((q) => used.add(q.a.id));
    pins.push({
      key: group.map((q) => q.a.id).join("-"),
      alerts: group.map((q) => q.a),
      x: group.reduce((s, q) => s + q.x, 0) / group.length,
      y: group.reduce((s, q) => s + q.y, 0) / group.length,
    });
  });
  return pins;
}

  const unread = state.notifications.filter((n) => !n.read).length;
  const filtered = alerts.filter((a) => filter === "all" || CATEGORY_BY_ID[a.categoryId].type === filter);
  const pins = useMemo(() => clusterPins(dedupeEvents(filtered)), [filtered]);
  const near = filtered
    .map((a) => ({ a, km: haversineKm(pos, a) }))
    .filter((x) => x.km <= NEAR_KM)
    .sort((x, y) => x.km - y.km)
    .map((x) => x.a);
  const selected = selectedId ? alerts.find((a) => a.id === selectedId) : null;
  const me = projectToMap(pos);
  const PEEK = 156;

  const openAlert = (id) => { setSelectedId(id); setSnap("half"); };
  const closeSummary = () => { setSelectedId(null); setSnap("peek"); };

  return (
    <div className="screen" style={{ overflow: "hidden" }}>
      <div className="map95" aria-label="Carte des alertes autour de Pontoise">
        {MAP_ART}
        {state.demo.permissionDenied ? null : <span className="me" style={{ left: me.x, top: me.y }} role="img" aria-label="Vous êtes ici" />}
        {pins.map((p) => {
          if (p.alerts.length > 1) {
            return <ClusterMarker key={p.key} count={p.alerts.length} style={{ position: "absolute", left: p.x, top: p.y, transform: "translate(-50%,-50%)", zIndex: 4 }} onClick={() => toast(`${p.alerts.length} alertes regroupées : le zoom arrive avec la carte interactive.`)} />;
          }
          const a = p.alerts[0];
          const cat = CATEGORY_BY_ID[a.categoryId];
          return (
            <span key={p.key} className="map-pin" style={{ left: p.x, top: p.y }}>
              <Marker family={cat.family} icon={cat.icon} selected={selectedId === a.id} critical={cat.priority === "critique"} label={`${cat.label} : ${a.title}`} onClick={() => openAlert(a.id)} />
            </span>
          );
        })}
      </div>
      <div className="map-top">
        <button type="button" className="search" onClick={() => toast("La recherche arrive bientôt.")}><Icon name="magnifying-glass" />Rechercher une ville, une rue…</button>
        <IconButton icon="bell" label="Notifications" badge={unread || null} onClick={() => toast("Le centre de notifications arrive bientôt.")} />
      </div>
      <div className="map-pill"><Pill onClick={() => { setSelectedId(null); setSnap("half"); }}>3 nouvelles alertes</Pill></div>
      <IconButton icon="crosshair" label="Recentrer sur ma position" className="map-locate" style={{ bottom: PEEK + 12 }} onClick={() => toast(state.demo.permissionDenied ? "Localisation désactivée : position choisie manuellement (Pontoise)." : "Carte centrée sur votre position.")} />

      {selected ? (
        <BottomSheet snap={snap === "peek" ? "half" : snap} peek={PEEK} onSnap={setSnap} onClose={closeSummary}>
          <AlertSummary alert={selected} onClose={closeSummary} />
        </BottomSheet>
      ) : (
        <BottomSheet snap={snap} peek={PEEK} onSnap={setSnap} dismissible={false}
          title={near.length ? `${near.length} alerte${near.length > 1 ? "s" : ""} autour de vous` : "Aucune alerte autour de vous"}>
          <SegmentedControl block label="Type d'alertes" value={filter} onChange={setFilter} options={[{ value: "all", label: "Toutes" }, { value: "positive", label: "Positives" }, { value: "negative", label: "Négatives" }]} />
          {near.length === 0 ? (
            <EmptyState title="Aucune alerte dans cette zone.">Revenez plus tard ou élargissez votre zone de recherche.</EmptyState>
          ) : near.map((a) => <AlertCard key={a.id} alert={a} onOpen={() => openAlert(a.id)} />)}
        </BottomSheet>
      )}
    </div>
  );
}

function AlertsScreen() {

function maskPhone(p) {
  const d = (p || "").replace(/\D/g, "");
  return d.length >= 4 ? `${d.slice(0, 2)} •• •• •• ${d.slice(-2)}` : "votre numéro";
}
function maskEmail(e) {
  const [u, dom] = (e || "").split("@");
  return u && dom ? `${u[0]}•••@${dom}` : "votre adresse";
}

function BrandMark({ size = 64 }) {
  return <span className="brand-mark" style={{ width: size, height: size, fontSize: size * 0.4 }} aria-hidden="true">95</span>;
}

function IdentityBadge({ status }) {
  if (status === "verifiee") return <span className="badge badge-status st-done"><Icon name="seal-check-fill" />Identité vérifiée</span>;
  if (status === "en_cours") return <span className="badge badge-status st-soon"><Icon name="timer" />Vérification en cours</span>;
  return <span className="badge badge-status st-draft"><Icon name="identification-card" />Identité non vérifiée</span>;
}

}

function SignupInfoScreen() {
  const { state, dispatch } = useStore();
  const online = useOnline();
  const [form, setForm] = useState(state.auth.form);
  const [errors, setErrors] = useState({});
  const set = (k) => (e) => { setForm({ ...form, [k]: e.target.value }); setErrors({ ...errors, [k]: null }); };
  const submit = online(() => {
    const err = {};
    if (!form.firstName.trim()) err.firstName = "Indiquez votre prénom.";
    if (!form.lastName.trim()) err.lastName = "Indiquez votre nom.";
    if (!/^\S+@\S+\.\S+$/.test(form.email)) err.email = "Saisissez une adresse e-mail valide.";
    else if (form.email.trim().toLowerCase() === "deja@exemple.fr") err.email = "Cet e-mail est déjà utilisé. Connectez-vous ou utilisez une autre adresse.";
    if (form.phone.replace(/\D/g, "").length !== 10) err.phone = "Saisissez un numéro à 10 chiffres.";
    setErrors(err);
    if (Object.keys(err).length) return;
    dispatch({ type: "AUTH_SET", patch: { form, step: "signup-phone" } });
  });
  return (
    <div className="screen auth">
      <AuthHeader title="Créer un compte" step={1} onBack={() => dispatch({ type: "AUTH_GO", step: "login" })} />
      <form className="screen-pad" onSubmit={(e) => { e.preventDefault(); submit(); }} noValidate>
        <p className="auth-lead">Ces informations restent privées. Seuls votre prénom et l'initiale de votre nom peuvent être affichés.</p>
        <div className="field-row">
          <Field id="su-first" label="Prénom" autoComplete="given-name" value={form.firstName} error={errors.firstName} onChange={set("firstName")} />
          <Field id="su-last" label="Nom" autoComplete="family-name" value={form.lastName} error={errors.lastName} onChange={set("lastName")} />
        </div>
        <Field id="su-email" label="E-mail" type="email" autoComplete="email" value={form.email} error={errors.email} onChange={set("email")} />

function OtpInput({ value, onChange, error, id }) {
  const [focused, setFocused] = useState(false);
  const digits = value.padEnd(6, " ").split("");
  return (
    <div className={cx("otp", error && "is-error")}>
      <input id={id} inputMode="numeric" autoComplete="one-time-code" maxLength={6} value={value} aria-invalid={error ? true : undefined}
        aria-describedby={error ? `${id}-err` : undefined} aria-label="Code de vérification à 6 chiffres"
        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        onChange={(e) => onChange(e.target.value.replace(/\D/g, "").slice(0, 6))} />
      {digits.map((d, i) => <span key={i} aria-hidden="true" className={cx(focused && i === Math.min(value.length, 5) && "is-active")}>{d.trim()}</span>)}
    </div>
  );
}

/* Vérification d'identité : choix du document puis statut (utilisé à l'inscription et depuis le profil) */
function IdentityDocStep({ onSent, onLater, step, onBack }) {
  const { state, dispatch } = useStore();
  const online = useOnline();
  const [doc, setDoc] = useState(state.auth.docType);
  const [sending, setSending] = useState(false);
  const send = online(() => {
    setSending(true);
    setTimeout(() => { setSending(false); dispatch({ type: "AUTH_SET", patch: { docType: doc } }); onSent(); }, 900);
  });
  return (
    <div className="screen auth">
      <AuthHeader title={step ? "Créer un compte" : "Vérifier mon identité"} step={step} onBack={onBack} />
      <div className="screen-pad">
        <div className="auth-intro">
          <h2 className="question">Vérifiez votre identité</h2>
          <p className="auth-lead">Une seule fois. Votre document sert uniquement à la vérification : il n'est jamais affiché publiquement.</p>
        </div>
        {ID_DOCS.map((d) => <RadioCard key={d.id} name="id-doc" value={d.id} checked={doc === d.id} onChange={setDoc} icon="identification-card" title={d.label} description={d.hint} />)}
      </div>
      <div className="screen-footer stack-footer">
        <Button block icon="camera" loading={sending} onClick={send}>{sending ? "Envoi du document…" : "Prendre le document en photo"}</Button>
        {onLater ? <Button block variant="ghost" onClick={onLater}>Plus tard</Button> : null}
      </div>
    </div>
  );
}

  echouee: { tone: "error", icon: "warning", title: "La vérification a échoué", text: "Le service n'a pas pu lire votre document. Faites une nouvelle tentative ou demandez une vérification manuelle.", step: 1, failed: true },
  refusee: { tone: "error", icon: "x", title: "Document refusé", text: "La photo est floue ou le document a expiré. Reprenez une photo nette d'un document en cours de validité.", step: 1, failed: true },
  manuelle: { tone: "info", icon: "user-circle", title: "Vérification manuelle", text: "Un agent examine votre dossier. Délai indicatif : 48 h. Vous serez notifié du résultat.", step: 1 },

function IdentityStatusView({ onContinue, onRetry }) {
  const { state, dispatch } = useStore();
  const result = state.auth.idResult;
  const v = ID_RESULT_VIEW[result];
  const doc = ID_DOCS.find((d) => d.id === state.auth.docType);
  const steps = [
    { id: "sent", label: "Document envoyé", detail: doc ? doc.label : null },
    { id: "check", label: v.failed ? "Vérification interrompue" : result === "reussie" ? "Vérification terminée" : "Vérification", detail: result === "en_cours" ? "Délai indicatif : moins de 24 h" : result === "manuelle" ? "Délai indicatif : 48 h" : null },
    { id: "done", label: "Identité vérifiée", final: true },
  ];
  return (
    <Fragment>
      <div className="screen-pad">
        <div className="auth-center compact" role="status">
          <span className={cx("status-hero", `tone-${v.tone}`)}><Icon name={v.icon} /></span>
          <h2>{v.title}</h2>
          <p>{v.text}</p>
        </div>
        <div className="card"><Timeline steps={steps} currentIndex={v.step} /></div>
      </div>
      <div className="screen-footer stack-footer">
        {v.failed ? (
          <Fragment>
            <Button block icon="camera" onClick={onRetry}>{result === "refusee" ? "Reprendre une photo" : "Nouvelle tentative"}</Button>
            {result === "echouee" ? <Button block variant="ghost" onClick={() => dispatch({ type: "AUTH_SET", patch: { idResult: "manuelle" } })}>Demander une vérification manuelle</Button> : <Button block variant="ghost" onClick={onContinue}>Continuer sans vérification</Button>}
          </Fragment>
        ) : <Button block onClick={onContinue}>Continuer</Button>}
      </div>
    </Fragment>
  );
}

            {state.session.status !== "in" ? <Button variant="ghost" onClick={() => { dispatch({ type: "LOGIN", method: "demo", identity: "verifiee" }); setOpen(false); }}>Passer la connexion</Button> : null}
          </div>
          <hr />
          <Button variant="secondary" icon="squares-four" onClick={() => { if (state.session.status !== "in") dispatch({ type: "LOGIN", method: "demo", identity: "verifiee" }); push("components"); setOpen(false); }}>Bibliothèque de composants</Button>
          <Button variant="ghost" icon="arrow-counter-clockwise" onClick={() => confirm({ title: "Réinitialiser le prototype ?", body: "Les alertes, votes et commentaires reviennent à leur état de départ. Vos préférences d'affichage sont conservées.", confirmLabel: "Réinitialiser", onConfirm: () => { reset(); toast("Prototype réinitialisé."); } })}>Réinitialiser</Button>
        </aside>
      ) : null}
    </Fragment>
  );
}

   APP
   ===================================================================== */
function useClock(speed) {
  const [now, setNow] = useState(BOOT_TIME);
  const last = useRef(Date.now());
  useEffect(() => {
    last.current = Date.now();
    const interval = speed > 1 ? 1000 : 15000;
    const id = setInterval(() => {
      const t = Date.now();
      const dt = t - last.current;
      last.current = t;
      setNow((n) => n + dt * speed);
    }, interval);
    return () => clearInterval(id);
  }, [speed]);
  return now;
}

function usePrefsEffects(prefs) {
  useEffect(() => {
    const root = document.documentElement;
    if (prefs.theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", prefs.theme);
    root.style.setProperty("--text-scale", `${prefs.textScale}%`);
    if (prefs.highContrast) root.setAttribute("data-contrast", "high"); else root.removeAttribute("data-contrast");
    if (prefs.reduceMotion) root.setAttribute("data-motion", "reduce"); else root.removeAttribute("data-motion");
    storage.set(PREFS_KEY, prefs);
  }, [prefs]);
}

function App() {
  const [state, dispatch] = useReducer(reducer, undefined, initialState);
  const now = useClock(state.demo.timeSpeed);
  usePrefsEffects(state.prefs);
  const store = useMemo(() => ({ state, dispatch }), [state]);

  const TabScreen = TAB_SCREENS[state.nav.tab];
  const top = state.nav.stack[state.nav.stack.length - 1];
  const topDef = top ? STACK_SCREENS[top.id] : null;
  const hideTabbar = topDef?.modal;
  const sheetDef = state.sheet && SHEETS[state.sheet.id];

  return (
    <StoreContext.Provider value={store}>
      <ClockContext.Provider value={now}>
        <div className="stage">
          <div className="device">
            <div className="app">
              <div className="statusbar" aria-hidden="true">
                <span>{fmtClock(now)}</span>
                <span className="sb-icons"><Icon name="cell-signal-full" />{state.demo.offline ? <Icon name="wifi-slash" /> : <Icon name="wifi-high" />}<Icon name="battery-full" /></span>
              </div>
              {state.demo.offline ? <Banner tone="offline" className="global-banner" title="Vous êtes actuellement hors connexion.">Les fonctionnalités dépendantes du réseau sont désactivées.</Banner> : null}
              {state.session.status !== "in" ? (
                <main className="screen-area">{state.session.status === "splash" ? <SplashScreen /> : <AuthFlow />}</main>
              ) : (
              <Fragment>
              <main className="screen-area">
                <TabScreen />
                {state.nav.stack.map((s) => {
                  const def = STACK_SCREENS[s.id];
                  const C = def.component;
                  return <div key={s.key} className={cx("stack-layer", def.modal && "is-modal")}><C {...s.params} /></div>;
                })}
                {sheetDef ? (
                  <BottomSheet modal snap={state.sheet.snap} title={sheetDef.title} onSnap={(s) => dispatch({ type: "SNAP_SHEET", snap: s })} onClose={() => dispatch({ type: "CLOSE_SHEET" })}>
                    <sheetDef.component {...state.sheet.params} />
                  </BottomSheet>
                ) : null}
              </main>
              {!hideTabbar && !state.prefs.reportHintSeen && !state.nav.stack.length ? (
                <button type="button" className="report-hint" onClick={() => dispatch({ type: "SET_PREF", key: "reportHintSeen", value: true })} aria-label="Signalez un événement ici. Fermer l'aide">
                  <span className="tooltip">Signalez un événement ici</span>
                </button>
              ) : null}
              {hideTabbar ? null : <TabBar />}
              </Fragment>
              )}
              <ToastHost hasTabbar={state.session.status === "in" && !hideTabbar} />
              {state.modal ? <ConfirmModal modal={state.modal} onClose={() => dispatch({ type: "CLOSE_MODAL" })} /> : null}
            </div>
          </div>
        </div>
        <DemoPanel />
      </ClockContext.Provider>
    </StoreContext.Provider>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return (
        <div className="fatal" role="alert">
          <h1 style={{ margin: 0, font: "700 var(--fs-h1)/var(--lh-h1) var(--font)" }}>Une erreur est survenue</h1>
          <p style={{ margin: 0, color: "var(--text-muted)" }}>Le prototype a rencontré un problème. Rechargez la page pour recommencer.</p>
          <pre style={{ whiteSpace: "pre-wrap", fontSize: 12, color: "var(--text-muted)" }}>{String(this.state.error.message || this.state.error)}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);

</script>
