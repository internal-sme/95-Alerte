<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Alertes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/d123534fb8beaf25cdad999ec704235a">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95 scroll95">
    <div class="screen-title row">
      <div><h1>Alertes</h1><p>25 alertes actives dans le Val-d'Oise</p></div>
      <button class="icon-btn flat" type="button" aria-label="Filtres"><span class="ph i i-sliders-horizontal" aria-hidden="true"></span></button>
    </div>
    <div class="screen-pad">
      <div class="seg is-block" role="group" aria-label="Type d'alertes">
        <button type="button" aria-pressed="{{f.all}}" onClick="{{showAll}}">Toutes</button>
        <button type="button" aria-pressed="{{f.positive}}" onClick="{{showPositive}}">Positives</button>
        <button type="button" aria-pressed="{{f.negative}}" onClick="{{showNegative}}">Négatives</button>
      </div>
      <section class="list-section">
        <h2 class="section-label">À moins de 5 km</h2>
        <sc-for list="{{near}}" as="r" hint-placeholder-count="3">
          <dc-import name="AlertCard" row="{{r}}" hint-size="100%,124px"></dc-import>
        </sc-for>
      </section>
      <section class="list-section">
        <h2 class="section-label">Ailleurs dans le Val-d'Oise</h2>
        <sc-for list="{{rest}}" as="r" hint-placeholder-count="3">
          <dc-import name="AlertCard" row="{{r}}" hint-size="100%,124px"></dc-import>
        </sc-for>
      </section>
    </div>
  </div>
  <nav class="tabbar" aria-label="Navigation principale">
    <a class="tab" href="{{l.map}}"><span class="ph i i-map-trifold" aria-hidden="true"></span>Carte</a>
    <a class="tab" href="{{l.alerts}}" aria-current="page"><span class="ph i i-list-bullets" aria-hidden="true"></span>Alertes</a>
    <a class="tab tab-report" href="{{l.report}}" aria-label="Signaler un événement"><span class="fab"><span class="ph i i-plus" aria-hidden="true"></span></span>Signaler</a>
    <a class="tab" href="{{l.activity}}"><span class="ph i i-pulse" aria-hidden="true"></span>Activité</a>
    <a class="tab" href="{{l.profile}}"><span class="ph i i-user-circle" aria-hidden="true"></span>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>

  ['a6', 'Voirie', 'vigilance', 'traffic-cone', 'negative', 'Nid-de-poule dangereux sur la chaussée', "Saint-Ouen-l'Aumône", 1.94, 95, 'en_traitement', 22, 0, 3, true],

  ['a27', 'Événement', 'positive', 'calendar-star', 'positive', 'Inauguration de la nouvelle aire de jeux', 'Roissy-en-France', 30.5, 150, '', 33, 0, 4, true]
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    const filter = this.state.filter;
    const list = ALERTS.filter((r) => filter === 'all' || r[4] === filter);
    const near = list.filter((r) => r[7] <= 5).sort((a, b) => a[7] - b[7]);
    const rest = list.filter((r) => r[7] > 5).sort((a, b) => a[8] - b[8]).slice(0, 10);
    return {
      theme: s ? 't-dark' : 't-light',
      l: { map: 'Main' + s + '.dc.html', alerts: 'Alerts' + s + '.dc.html', report: 'Report' + s + '.dc.html', activity: 'Activity' + s + '.dc.html', profile: 'Profile' + s + '.dc.html' },
      f: { all: filter === 'all', positive: filter === 'positive', negative: filter === 'negative' },
      showAll: () => this.setState({ filter: 'all' }),
      showPositive: () => this.setState({ filter: 'positive' }),
      showNegative: () => this.setState({ filter: 'negative' }),
      near: near,
      rest: rest
    };
  }
}
</script>
</body>
</html>
