          <ol class="steps-list">

<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "state": {"editor": "enum", "options": ["denied", "unavailable", "help"], "default": "denied"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    const st = this.props.state || 'denied';
    const un = st === 'unavailable';
    return {
      theme: s ? 't-dark' : 't-light',
      title: un ? 'Position introuvable pour le moment' : 'Localisation désactivée',
      text: un ? 'Le téléphone ne trouve pas votre position. Choisissez votre commune : vous pourrez réessayer plus tard.' : 'Choisissez votre commune : vous verrez les mêmes alertes, sans les distances.',
      showHelp: !un, isHelp: st === 'help',
      l: { later: 'Login' + s + '.dc.html', commune: 'Commune' + s + '.dc.html', help: 'LocationHelp' + s + '.dc.html', denied: 'Denied' + s + '.dc.html' }
    };
  }
}
</script>
