<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    const go = (n) => n + s + '.dc.html';
    return { theme: s ? 't-dark' : 't-light', l: { Activity: go('Activity'), Alerts: go('Alerts'), Login: go('Login'), Main: go('Main'), MapSelected: go('MapSelected'), Profile: go('Profile'), Report: go('Report'), ReportPhoto: go('ReportPhoto'), ReportPlace: go('ReportPlace'), ReportQuit: go('ReportQuit') } };
  }
}
</script>
