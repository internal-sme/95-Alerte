<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Confirmation de suppression</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/a8af07a769b67c5d0b02a73adb85e841">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 t-light" style="width: 390px; height: 844px">
  <header class="screen-header">
    <a class="icon-btn" href="Profile.dc.html" aria-label="Retour"><span class="ph i i-caret-left" aria-hidden="true"></span></a>
    <h1>Composants</h1>
    <span></span>
  </header>
  <div class="screen95">
    <div class="screen-pad">
      <p class="section-label">Boutons</p>
      <button class="btn btn-primary" type="button">Publier l'alerte</button>
      <button class="btn btn-secondary" type="button"><span class="ph i i-map-pin" aria-hidden="true"></span>Choisir sur la carte</button>
      <div class="lib-row">
        <button class="btn btn-ghost" type="button">Plus tard</button>
        <button class="btn btn-destructive" type="button" onClick="{{ask}}"><span class="ph i i-trash-simple" aria-hidden="true"></span>Supprimer</button>
      </div>
      <button class="btn btn-primary" type="button" disabled>Confirmer cette position</button>
    </div>
    <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
      <div class="modal-scrim">
        <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body">
          <h3 id="modal-title">Supprimer cette alerte ?</h3>
          <p id="modal-body">Elle ne sera plus visible par les utilisateurs.</p>
          <div class="actions">
            <button class="btn btn-secondary" type="button" onClick="{{cancel}}">Annuler</button>
            <button class="btn btn-destructive" type="button" onClick="{{confirm}}">Supprimer</button>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div class="toast-host" aria-live="polite">
      <div class="toast" role="status"><span class="ph i i-check-circle-fill" aria-hidden="true"></span>Alerte supprimée.</div>
    </div>
  </sc-if>
  <nav class="tabbar" aria-label="Navigation principale">
    <a class="tab" href="Main.dc.html"><span class="ph i i-map-trifold" aria-hidden="true"></span>Carte</a>
    <a class="tab" href="Alerts.dc.html"><span class="ph i i-list-bullets" aria-hidden="true"></span>Alertes</a>
    <a class="tab tab-report" href="Report.dc.html" aria-label="Signaler un événement"><span class="fab"><span class="ph i i-plus" aria-hidden="true"></span></span>Signaler</a>
    <a class="tab" href="Activity.dc.html"><span class="ph i i-pulse" aria-hidden="true"></span>Activité</a>
    <a class="tab" href="Profile.dc.html" aria-current="page"><span class="ph i i-user-circle-fill" aria-hidden="true"></span>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, done: false };
  }
  renderVals() {
    return {
      open: this.state.open,
      done: this.state.done,
      ask: () => this.setState({ open: true, done: false }),
      cancel: () => this.setState({ open: false }),
      confirm: () => this.setState({ open: false, done: true })
    };
  }
}
</script>
</body>
</html>
