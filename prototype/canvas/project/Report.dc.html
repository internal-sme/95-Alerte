<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Signaler</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7a46598493f98dc187c0705e0b5c6d73">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <header class="screen-header">
    <a class="icon-btn" href="{{back}}" aria-label="Fermer"><span class="ph i i-x" aria-hidden="true"></span></a>
    <h1>Signaler</h1>
    <span></span>
  </header>
  <div class="screen95 scroll95">
    <div class="screen-pad">
      <div class="stepper" role="progressbar" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1" aria-label="Étape 1 sur 7">
        <div class="lbl"><span>Étape 1 sur 7</span><span>Type</span></div>
        <div class="track"><i style="width: 14%"></i></div>
      </div>
      <h2 class="question">Que souhaitez-vous signaler ?</h2>
      <label class="radio-card is-large fam-positive">
        <input type="radio" name="report-type" value="positive" checked="{{t.positive}}" onChange="{{pickPositive}}">
        <span class="rc-icon"><span class="ph ph-lg i i-star-fill" aria-hidden="true"></span></span>
        <span><b>Un événement positif</b><small>Initiative, solidarité, culture, sport, vie de quartier…</small></span>
        <span class="rc-dot"></span>
      </label>
      <label class="radio-card is-large fam-incident">
        <input type="radio" name="report-type" value="negative" checked="{{t.negative}}" onChange="{{pickNegative}}">
        <span class="rc-icon"><span class="ph ph-lg i i-warning-fill" aria-hidden="true"></span></span>
        <span><b>Un événement négatif</b><small>Incident, danger, dégradation, propreté, nuisance…</small></span>
        <span class="rc-dot"></span>
      </label>
      <div class="banner banner-emergency" role="note"><span class="ph i i-siren-fill" aria-hidden="true"></span><span>En cas d'urgence nécessitant une intervention immédiate, contactez les services d'urgence appropriés.</span></div>
    </div>
  </div>
  <div class="screen-footer">
    <button class="btn btn-primary btn-block" type="button" disabled="{{noType}}">Continuer</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: null };
  }
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    return {
      theme: s ? 't-dark' : 't-light',
      back: 'Main' + s + '.dc.html',
      t: { positive: this.state.type === 'positive', negative: this.state.type === 'negative' },
      pickPositive: () => this.setState({ type: 'positive' }),
      pickNegative: () => this.setState({ type: 'negative' }),
      noType: !this.state.type
    };
  }
}
</script>
</body>
</html>
