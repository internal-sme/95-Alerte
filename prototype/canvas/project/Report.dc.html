<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Signaler</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/afae059a4a33057ea9103f53bff2f3fb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="iphone">
<span class="island" aria-hidden="true"></span>
<div class="a95 {{theme}}">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sb-icons"><span class="ph i i-cell-signal-full"></span><span class="ph i i-wifi-high"></span><span class="ph i i-battery-full"></span></span></div>
  <header class="screen-header">
    <a class="icon-btn" href="{{back}}" aria-label="Retour"><span class="ph i i-caret-left" aria-hidden="true"></span></a>
    <h1>Signaler</h1>
    <span></span>
  </header>
  <div class="screen95 scroll95">
    <div class="screen-pad">
      <div class="stepper" role="progressbar" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1" aria-label="Étape 1 sur 7">
        <div class="lbl"><span>Étape 1 sur 7</span><span>Type</span></div>
        <div class="track"><i style="width: 14%"></i></div>
      </div>
      <div class="empty">
        <span class="empty-ill"><span class="ph i i-plus" aria-hidden="true" style="width: 32px; height: 32px"></span></span>
        <h4>Création d'une alerte</h4>
        <p>Le parcours en 7 étapes (type, catégorie, lieu, description, photo, identité, prévisualisation) arrive en phase 6.</p>
        <span class="placeholder-phase"><span class="ph ph-sm i i-path" aria-hidden="true"></span>Arrive en phase 6</span>
      </div>
    </div>
  </div>
  <span class="home" aria-hidden="true"></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":414,"height":868}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    return { theme: s ? 't-dark' : 't-light', back: 'Main' + s + '.dc.html' };
  }
}
</script>
</body>
</html>
