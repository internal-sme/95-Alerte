<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Signaler · Erreur de publication</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/127f05763423314958ff0e5c7ffbfd12">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95">
<div class="stack-layer is-modal"><div class="screen report-flow"><header class="screen-header"><span></span><h1>Signaler</h1><a class="icon-btn" aria-label="Quitter le signalement" href="{{l.ReportQuit}}"><span class="ph i i-x" aria-hidden="true"></span></a></header><div class="report-outcome" role="alert"><span class="spot tone-neutral" aria-hidden="true"><span class="ph i i-cloud-slash-duotone" aria-hidden="true"></span></span><h2>Impossible de publier votre alerte. Vérifiez votre connexion.</h2><p>Votre signalement est gardé : rien n'est perdu.</p></div><div class="screen-footer report-footer"><a class="btn btn-primary btn-block" href="{{l.ReportPublishing}}"><span class="ph i i-arrows-clockwise" aria-hidden="true"></span>Réessayer</a><a class="btn btn-secondary btn-block" href="{{l.ReportPreview}}">Revenir à l'aperçu</a></div></div></div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    const go = (n) => n + s + '.dc.html';
    return { theme: s ? 't-dark' : 't-light', l: { Activity: go('Activity'), Alerts: go('Alerts'), Login: go('Login'), Main: go('Main'), MapSelected: go('MapSelected'), Profile: go('Profile'), Report: go('Report'), ReportPreview: go('ReportPreview'), ReportPublishing: go('ReportPublishing'), ReportQuit: go('ReportQuit') } };
  }
}
</script>
</body>
</html>
