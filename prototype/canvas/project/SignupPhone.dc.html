<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer un compte · Téléphone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f808232c804992589b56207037b2c7a1">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95 auth">
    <header class="screen-header">
      <a class="icon-btn" href="{{l.back}}" aria-label="Retour"><span class="ph i i-caret-left" aria-hidden="true"></span></a>
      <h1>Créer un compte</h1>
      <span></span>
    </header>
    <div class="auth-stepper">
      <div class="stepper" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2" aria-label="Étape 2 sur 4">
        <div class="lbl"><span>Étape 2 sur 4</span><span>Téléphone</span></div>
        <div class="track"><i style="width: 50%"></i></div>
      </div>
    </div>
    <div class="scroll95">
      <div class="screen-pad">
        <div class="auth-intro">
          <h2 class="question">Votre numéro de mobile</h2>
          <p class="auth-lead">Nous vous envoyons un code par SMS.</p>
        </div>
        <div class="field"><label for="su-phone">Téléphone mobile</label><input id="su-phone" class="input" type="tel" autocomplete="tel" value="06 12 34 56 42"></div>
        <p class="privacy-note"><span class="ph i i-lock-simple" aria-hidden="true"></span><span>Votre numéro n'est jamais affiché. Il sert uniquement à sécuriser votre compte.</span></p>
      </div>
    </div>
    <div class="screen-footer stack-footer">
      <a class="btn btn-primary btn-block" href="{{l.next}}">Recevoir le code</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    return { theme: s ? 't-dark' : 't-light', l: { back: 'SignupInfo' + s + '.dc.html', next: 'SignupCode' + s + '.dc.html' } };
  }
}
</script>
</body>
</html>
