<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer un compte · Téléphone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/e6ebe91302b2f34527775e92069e88d9">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95 auth">
    <header class="screen-header">
      <a class="icon-btn" href="{{l.back}}" aria-label="Retour"><span class="ph i i-caret-left" aria-hidden="true"></span></a>
      <h1>Créer un compte</h1>
      <span></span>
    </header>
    <div class="auth-stepper">
      <div class="stepper" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2" aria-label="Étape 2 sur 4">
        <div class="lbl"><span>Étape 2 sur 4</span><span>Téléphone</span></div>
        <div class="track"><i style="width: 50%"></i></div>
      </div>
    </div>
    <div class="scroll95">
      <div class="screen-pad">
        <div class="auth-intro">
          <h2 class="question">Vérifiez votre téléphone</h2>
          <p class="auth-lead">Saisissez le code à 6 chiffres envoyé par SMS au 06 •• •• •• 42.</p>
        </div>
        <div class="otp {{otpClass}}" role="img" aria-label="Code de vérification à 6 chiffres : {{code}}">
          <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
            <span aria-hidden="true">{{d}}</span>
          </sc-for>
        </div>
        <sc-if value="{{error}}" hint-placeholder-val="{{false}}">
          <span class="err" role="alert"><span class="ph ph-sm i i-warning-fill" aria-hidden="true"></span>Code incorrect. Vérifiez le SMS ou demandez un nouveau code.</span>
        </sc-if>
        <span class="link-btn left" style="display: inline-grid; place-items: center">Renvoyer le code</span>
        <a class="btn btn-primary btn-block" href="{{l.next}}">Vérifier</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"error":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    const error = this.props.error === true;
    const code = error ? '000000' : '482913';
    return {
      theme: s ? 't-dark' : 't-light',
      error,
      code,
      otpClass: error ? 'is-error' : '',
      digits: code.split(''),
      l: { back: 'SignupInfo' + s + '.dc.html', next: error ? 'SignupPhone' + s + '.dc.html' : 'SignupEmail' + s + '.dc.html' }
    };
  }
}
</script>
</body>
</html>
