<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Votre profil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7a46598493f98dc187c0705e0b5c6d73">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95 auth">
    <header class="screen-header">
      <a class="icon-btn" href="{{l.back}}" aria-label="Retour"><span class="ph i i-caret-left" aria-hidden="true"></span></a>
      <h1>Votre profil</h1>
      <span></span>
    </header>
    <div class="scroll95">
      <div class="screen-pad">
        <div class="identity">
          <span class="avatar" aria-hidden="true">JD</span>
          <div><b>Jean Dupont</b><span class="badge badge-status st-soon"><span class="ph i i-timer" aria-hidden="true"></span>Vérification en cours</span></div>
        </div>
        <section class="list-section">
          <h2 class="section-label">Nom affiché sur vos alertes identifiées</h2>
          <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
            <label class="radio-card">
              <input type="radio" name="display" value="{{o.id}}" checked="{{o.on}}" onChange="{{o.pick}}">
              <span class="rc-icon" style="background: var(--primary-soft); color: var(--primary)"><span class="ph ph-lg i i-user-circle" aria-hidden="true"></span></span>
              <span><b>{{o.title}}</b><small>{{o.hint}}</small></span>
              <span class="rc-dot"></span>
            </label>
          </sc-for>
        </section>
        <div class="preview-author"><span class="ph i i-eye" aria-hidden="true"></span>Vous apparaîtrez comme : <b>{{name}}</b></div>
        <p class="privacy-note"><span class="ph i i-detective" aria-hidden="true"></span><span>Pour chaque alerte, vous pourrez aussi choisir de publier anonymement. Votre e-mail et votre téléphone ne sont jamais affichés.</span></p>
      </div>
    </div>
    <div class="screen-footer">
      <a class="btn btn-primary btn-block" href="{{l.next}}">Terminer</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { display: 'initial' };
  }
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    const opts = [
      { id: 'initial', title: 'Jean D.', hint: 'Prénom et initiale du nom (recommandé)' },
      { id: 'first', title: 'Jean', hint: 'Prénom seulement' }
    ];
    return {
      theme: s ? 't-dark' : 't-light',
      options: opts.map((o) => ({ ...o, on: this.state.display === o.id, pick: () => this.setState({ display: o.id }) })),
      name: this.state.display === 'first' ? 'Jean' : 'Jean D.',
      l: { back: 'IdentityStatus' + s + '.dc.html', next: 'SignupDone' + s + '.dc.html' }
    };
  }
}
</script>
</body>
</html>
