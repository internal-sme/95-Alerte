<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer un compte · Identité</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/e6ebe91302b2f34527775e92069e88d9">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95 auth">
    <header class="screen-header">
      <a class="icon-btn" href="{{l.back}}" aria-label="Retour"><span class="ph i i-caret-left" aria-hidden="true"></span></a>
      <h1>Créer un compte</h1>
      <span></span>
    </header>
    <div class="auth-stepper">
      <div class="stepper" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="4" aria-label="Étape 4 sur 4">
        <div class="lbl"><span>Étape 4 sur 4</span><span>Identité</span></div>
        <div class="track"><i style="width: 100%"></i></div>
      </div>
    </div>
    <div class="scroll95">
      <div class="screen-pad">
        <div class="auth-intro">
          <h2 class="question">Vérifiez votre identité</h2>
          <p class="auth-lead">Une seule fois. Votre document sert uniquement à la vérification : il n'est jamais affiché publiquement.</p>
        </div>
        <sc-for list="{{docs}}" as="d" hint-placeholder-count="3">
          <label class="radio-card">
            <input type="radio" name="id-doc" value="{{d.id}}" checked="{{d.on}}" onChange="{{d.pick}}">
            <span class="rc-icon" style="background: var(--primary-soft); color: var(--primary)"><span class="ph ph-lg i i-identification-card" aria-hidden="true"></span></span>
            <span><b>{{d.label}}</b><small>{{d.hint}}</small></span>
            <span class="rc-dot"></span>
          </label>
        </sc-for>
      </div>
    </div>
    <div class="screen-footer stack-footer">
      <a class="btn btn-primary btn-block" href="{{l.next}}"><span class="ph i i-camera" aria-hidden="true"></span>Prendre le document en photo</a>
      <a class="btn btn-ghost btn-block" href="{{l.later}}">Plus tard</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { doc: 'cni' };
  }
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    const docs = [
      { id: 'cni', label: "Carte d'identité", hint: 'Recto et verso' },
      { id: 'passeport', label: 'Passeport', hint: 'Page avec la photo' },
      { id: 'sejour', label: 'Titre de séjour', hint: 'Recto et verso' }
    ];
    return {
      theme: s ? 't-dark' : 't-light',
      docs: docs.map((d) => ({ ...d, on: this.state.doc === d.id, pick: () => this.setState({ doc: d.id }) })),
      l: { back: 'SignupEmail' + s + '.dc.html', next: 'IdentityStatus' + s + '.dc.html', later: 'ProfileSetup' + s + '.dc.html' }
    };
  }
}
</script>
</body>
</html>
