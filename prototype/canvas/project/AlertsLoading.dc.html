<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Alertes · chargement</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/1bf65a5c9978cc4d2dfc271d0369d7c4">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95">
<div class="screen feed"><div class="feed-top"><div class="screen-title"><h1>Alertes</h1><p>Pontoise · 5 km · dernières 24 h</p></div><div class="map-top"><a class="search" href="{{l.Search}}"><span class="ph i i-magnifying-glass" aria-hidden="true"></span><span>Rechercher<small> · alerte, lieu, catégorie</small></span></a><button type="button" class="icon-btn is-filter" aria-label="Filtres"><span class="ph i i-sliders-horizontal" aria-hidden="true"></span></button></div><div class="map-chips" role="group" aria-label="Type d'alertes"><button type="button" class="chip" aria-pressed="true"><span class="ph i i-check" aria-hidden="true"></span>Toutes</button><button type="button" class="chip" aria-pressed="false">Positives</button><button type="button" class="chip" aria-pressed="false">Négatives</button></div></div><div class="screen-pad feed-body"><div class="feed-bar"><span aria-live="polite">Chargement…</span><button type="button" class="sort-chip" aria-label="Trier par : Pertinence. Modifier le tri"><span class="ph i i-arrows-down-up" aria-hidden="true"></span>Pertinence<span class="ph ph-sm i i-caret-down" aria-hidden="true"></span></button></div><div class="skeleton" aria-hidden="true" style="height: 14px; width: 40%;"></div><div class="skeleton" aria-hidden="true" style="height: 104px; width: 100%; border-radius: var(--r-md);"></div><div class="skeleton" aria-hidden="true" style="height: 104px; width: 100%; border-radius: var(--r-md);"></div><div class="skeleton" aria-hidden="true" style="height: 104px; width: 100%; border-radius: var(--r-md);"></div></div></div>
  </div>
  <nav class="tabbar" aria-label="Navigation principale">
    <a class="tab" href="{{l.Main}}" aria-current="page"><span class="ph i i-map-trifold-fill" aria-hidden="true"></span>Carte</a>
    <a class="tab" href="{{l.Alerts}}"><span class="ph i i-list-bullets" aria-hidden="true"></span>Alertes</a>
    <a class="tab tab-report" href="{{l.Report}}" aria-label="Signaler un événement"><span class="fab"><span class="ph i i-plus" aria-hidden="true"></span></span>Signaler</a>
    <a class="tab" href="{{l.Activity}}"><span class="ph i i-pulse" aria-hidden="true"></span>Activité</a>
    <a class="tab" href="{{l.Profile}}"><span class="ph i i-user-circle" aria-hidden="true"></span>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    const go = (n) => n + s + '.dc.html';
    return { theme: s ? 't-dark' : 't-light', l: { Activity: go('Activity'), Alerts: go('Alerts'), Main: go('Main'), Profile: go('Profile'), Report: go('Report'), Search: go('Search') } };
  }
}
</script>
</body>
</html>
