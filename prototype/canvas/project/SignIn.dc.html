<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Se connecter</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/7a46598493f98dc187c0705e0b5c6d73">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95 auth">
    <header class="screen-header">
      <a class="icon-btn" href="{{l.back}}" aria-label="Retour"><span class="ph i i-caret-left" aria-hidden="true"></span></a>
      <h1>Se connecter</h1>
      <span></span>
    </header>
    <div class="scroll95">
      <div class="screen-pad">
        <div class="auth-intro">
          <h2 class="question">Content de vous revoir</h2>
          <p class="auth-lead">Connectez-vous avec l'adresse e-mail de votre compte 95 Alerte.</p>
        </div>
        <div class="field"><label for="signin-email">E-mail</label><input id="signin-email" class="input" type="email" autocomplete="email" value="jean.dupont@exemple.fr"></div>
        <div class="field"><label for="signin-password">Mot de passe</label><input id="signin-password" class="input" type="password" autocomplete="current-password" value="motdepasse"></div>
        <button type="button" class="btn btn-ghost btn-inline">Mot de passe oublié ?</button>
      </div>
    </div>
    <div class="screen-footer stack-footer">
      <a class="btn btn-primary btn-block" href="{{l.next}}">Se connecter</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    return { theme: s ? 't-dark' : 't-light', l: { back: 'Login' + s + '.dc.html', next: 'Main' + s + '.dc.html' } };
  }
}
</script>
</body>
</html>
