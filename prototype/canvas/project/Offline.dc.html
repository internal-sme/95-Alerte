<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>État · Hors connexion</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/79083ea7a8d50397cf9d20db824b6129">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 t-light" style="width: 390px; height: 844px">
  <div class="banner banner-offline global-banner" role="status"><span class="ph i i-wifi-slash" aria-hidden="true"></span><span><b>Vous êtes actuellement hors connexion.</b>Les fonctionnalités dépendantes du réseau sont désactivées.</span></div>
  <div class="screen95 scroll95">
    <div class="screen-title row">
      <div><h1>Alertes</h1><p>Dernière mise à jour à 18 h 42</p></div>
      <button class="icon-btn flat" type="button" aria-label="Filtres"><span class="ph i i-sliders-horizontal" aria-hidden="true"></span></button>
    </div>
    <div class="screen-pad">
      <div class="seg is-block" role="group" aria-label="Type d'alertes">
        <button type="button" aria-pressed="true">Toutes</button>
        <button type="button" aria-pressed="false">Positives</button>
        <button type="button" aria-pressed="false">Négatives</button>
      </div>
      <section class="list-section">
        <h2 class="section-label">À moins de 5 km</h2>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
          <dc-import name="AlertCard" row="{{r}}" hint-size="100%,124px"></dc-import>
        </sc-for>
      </section>
    </div>
  </div>
  <div class="toast-host">
    <div class="toast is-error" role="alert"><span class="ph i i-warning-fill" aria-hidden="true"></span>Vote impossible hors connexion.<button type="button" class="toast-action">OK</button></div>
  </div>
  <nav class="tabbar" aria-label="Navigation principale">
    <a class="tab" href="Main.dc.html"><span class="ph i i-map-trifold" aria-hidden="true"></span>Carte</a>
    <a class="tab" href="Alerts.dc.html" aria-current="page"><span class="ph i i-list-bullets" aria-hidden="true"></span>Alertes</a>
    <a class="tab tab-report" href="Report.dc.html" aria-label="Signaler un événement"><span class="fab"><span class="ph i i-plus" aria-hidden="true"></span></span>Signaler</a>
    <a class="tab" href="Activity.dc.html"><span class="ph i i-pulse" aria-hidden="true"></span>Activité</a>
    <a class="tab" href="Profile.dc.html"><span class="ph i i-user-circle" aria-hidden="true"></span>Profil</a>
  </nav>
</div>
</x-dc>

  ['a1', 'Incendie', 'incident', 'fire', 'negative', 'Fumée importante visible rue Carnot', 'Pontoise', 1.08, 12, 'transmis', 24, 3, 8, true],

  }
}
