<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer un compte · Informations</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/e6ebe91302b2f34527775e92069e88d9">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95 auth">
    <header class="screen-header">
      <a class="icon-btn" href="{{l.back}}" aria-label="Retour"><span class="ph i i-caret-left" aria-hidden="true"></span></a>
      <h1>Créer un compte</h1>
      <span></span>
    </header>
    <div class="auth-stepper">
      <div class="stepper" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-label="Étape 1 sur 4">
        <div class="lbl"><span>Étape 1 sur 4</span><span>Informations</span></div>
        <div class="track"><i style="width: 25%"></i></div>
      </div>
    </div>
    <div class="scroll95">
      <div class="screen-pad">
        <p class="auth-lead">Ces informations restent privées. Seuls votre prénom et l'initiale de votre nom peuvent être affichés.</p>
        <div class="field-row">
          <div class="field"><label for="su-first">Prénom</label><input id="su-first" class="input" autocomplete="given-name" value="Jean"></div>
          <div class="field"><label for="su-last">Nom</label><input id="su-last" class="input" autocomplete="family-name" value="Dupont"></div>
        </div>
        <sc-if value="{{error}}" hint-placeholder-val="{{false}}">
          <div class="field">
            <label for="su-email">E-mail</label>
            <input id="su-email" class="input" type="email" autocomplete="email" value="deja@exemple.fr" aria-invalid="true" aria-describedby="su-email-err">
            <span class="err" id="su-email-err"><span class="ph ph-sm i i-warning-fill" aria-hidden="true"></span>Cet e-mail est déjà utilisé. Connectez-vous ou utilisez une autre adresse.</span>
          </div>
        </sc-if>
        <sc-if value="{{ok}}" hint-placeholder-val="{{true}}">
          <div class="field"><label for="su-email">E-mail</label><input id="su-email" class="input" type="email" autocomplete="email" value="jean.dupont@exemple.fr"></div>
        </sc-if>
        <div class="field">
          <label for="su-phone">Téléphone mobile</label>
          <input id="su-phone" class="input" type="tel" autocomplete="tel" value="06 12 34 56 42" aria-describedby="su-phone-help">
          <span class="help" id="su-phone-help"><span>Un code de vérification vous sera envoyé par SMS.</span></span>
        </div>
        <a class="btn btn-primary btn-block" href="{{l.next}}">Continuer</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"error":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    const error = this.props.error === true;
    return {
      theme: s ? 't-dark' : 't-light',
      error,
      ok: !error,
      l: { back: 'Login' + s + '.dc.html', next: 'SignupPhone' + s + '.dc.html' }
    };
  }
}
</script>
</body>
</html>
