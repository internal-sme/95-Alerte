<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Activité</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/afae059a4a33057ea9103f53bff2f3fb">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="iphone">
<span class="island" aria-hidden="true"></span>
<div class="a95 {{theme}}">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sb-icons"><span class="ph i i-cell-signal-full"></span><span class="ph i i-wifi-high"></span><span class="ph i i-battery-full"></span></span></div>
  <div class="screen95 scroll95">
    <div class="screen-title"><h1>Activité</h1><p>Mes alertes, mes commentaires, mes interactions</p></div>
    <div class="screen-pad">
      <div class="empty">
        <span class="empty-ill"><span class="ph i i-pulse" aria-hidden="true" style="width: 32px; height: 32px"></span></span>
        <h4>Votre activité arrive bientôt</h4>
        <p>Vous retrouverez ici vos alertes, leur suivi par les services et vos interactions.</p>
        <span class="placeholder-phase"><span class="ph ph-sm i i-path" aria-hidden="true"></span>Arrive en phase 8</span>
      </div>
    </div>
  </div>
  <nav class="tabbar" aria-label="Navigation principale">
    <a class="tab" href="{{l.map}}"><span class="ph i i-map-trifold" aria-hidden="true"></span>Carte</a>
    <a class="tab" href="{{l.alerts}}"><span class="ph i i-list-bullets" aria-hidden="true"></span>Alertes</a>
    <a class="tab tab-report" href="{{l.report}}" aria-label="Signaler un événement"><span class="fab"><span class="ph i i-plus" aria-hidden="true"></span></span>Signaler</a>
    <a class="tab" href="{{l.activity}}" aria-current="page"><span class="ph i i-pulse-fill" aria-hidden="true"></span>Activité</a>
    <a class="tab" href="{{l.profile}}"><span class="ph i i-user-circle" aria-hidden="true"></span>Profil</a>
  </nav>
  <span class="home" aria-hidden="true"></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":414,"height":868}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    return {
      theme: s ? 't-dark' : 't-light',
      l: { map: 'Main' + s + '.dc.html', alerts: 'Alerts' + s + '.dc.html', report: 'Report' + s + '.dc.html', activity: 'Activity' + s + '.dc.html', profile: 'Profile' + s + '.dc.html' }
    };
  }
}
</script>
</body>
</html>
