<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Signaler · sans compte</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f808232c804992589b56207037b2c7a1">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a95 {{theme}}" style="width: 390px; height: 844px">
  <div class="screen95">
    <header class="screen-header">
      <a class="icon-btn" href="{{l.close}}" aria-label="Fermer"><span class="ph i i-x" aria-hidden="true"></span></a>
      <h1>Signaler</h1>
      <span></span>
    </header>
    <div class="scroll95">
      <div class="screen-pad">
        <div class="empty">
          <span class="empty-ill"><span class="ph i i-plus" aria-hidden="true" style="width: 32px; height: 32px"></span></span>
          <h4>Connectez-vous pour signaler</h4>
          <p>Un compte permet de transmettre votre signalement au bon service et d'en suivre le traitement. Vous pourrez publier anonymement.</p>
          <a class="btn btn-primary" href="{{l.login}}"><span class="ph i i-sign-in" aria-hidden="true"></span>Se connecter</a>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.dark === true ? '-dark' : '';
    return { theme: s ? 't-dark' : 't-light', l: { close: 'ProfileGuest' + s + '.dc.html', login: 'Login' + s + '.dc.html' } };
  }
}
</script>
</body>
</html>
